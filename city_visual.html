<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CityFlow</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #171a22;
    --surface: #1f2430;
    --border: #31394b;
    --text: #c8d0df;
    --muted: #73809b;
    --accent: #f4c24f;
    --local: #3f485d;
    --main: #2f638f;
    --highway: #216e7f;
    --inter: #2f3344;
    --block: #1d202b;
    --block-alt: #1a1d27;
  }

  body {
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(1200px 600px at 40% -20%, #273147 0%, #171a22 60%);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    display: flex;
    flex-direction: column;
  }

  #header {
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(31, 36, 48, 0.95);
    backdrop-filter: blur(4px);
    flex-shrink: 0;
  }

  #header h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--accent);
    white-space: nowrap;
  }

  .stats {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    flex: 1;
  }

  .stat {
    min-width: 72px;
    text-align: center;
  }

  .stat .v {
    display: block;
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    line-height: 1.1;
  }

  .stat .l {
    display: block;
    margin-top: 1px;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .controls {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  button {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 5px 10px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  button:hover { border-color: var(--accent); color: var(--accent); }
  button.active { border-color: var(--accent); color: var(--accent); background: rgba(244,194,79,0.1); }

  #canvas-wrap {
    position: relative;
    flex: 1;
    overflow: hidden;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
  }

  canvas.dragging { cursor: grabbing; }

  #legend {
    position: absolute;
    right: 12px;
    bottom: 12px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    background: rgba(29, 33, 44, 0.9);
    font-size: 10px;
    line-height: 1.75;
  }

  .leg { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .swatch { width: 14px; height: 8px; border-radius: 8px; }

  #zoom-tip {
    position: absolute;
    left: 12px;
    bottom: 12px;
    font-size: 10px;
    color: var(--muted);
    background: rgba(29, 33, 44, 0.9);
    border: 1px solid var(--border);
    padding: 8px 10px;
  }

  @media (max-width: 900px) {
    #header { gap: 10px; padding: 8px 10px; }
    #header h1 { font-size: 12px; }
    .stats { gap: 10px; }
    .stat { min-width: 58px; }
    .stat .v { font-size: 13px; }
    .controls { justify-content: center; }
  }
</style>
</head>
<body>

<div id="header">
  <h1>CityFlow</h1>
  <div class="stats">
    <div class="stat"><span class="v" id="s-tick">0</span><span class="l">Tick</span></div>
    <div class="stat"><span class="v" id="s-cars">0</span><span class="l">Active</span></div>
    <div class="stat"><span class="v" id="s-done">0</span><span class="l">Arrived</span></div>
    <div class="stat"><span class="v" id="s-stop">0</span><span class="l">Stopped</span></div>
    <div class="stat"><span class="v" id="s-avg">0.0</span><span class="l">Avg Travel</span></div>
    <div class="stat"><span class="v" id="s-zoom">100%</span><span class="l">Zoom</span></div>
  </div>
  <div class="controls">
    <button id="btn-slow">0.5x</button>
    <button id="btn-norm" class="active">1x</button>
    <button id="btn-fast">3x</button>
    <button id="btn-zout">-</button>
    <button id="btn-zreset">Reset View</button>
    <button id="btn-zin">+</button>
    <button id="btn-pause">Pause</button>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="c"></canvas>
  <div id="legend">
    <div class="leg"><span class="swatch" style="background:#3f485d"></span>Local road</div>
    <div class="leg"><span class="swatch" style="background:#2f638f"></span>Main street</div>
    <div class="leg"><span class="swatch" style="background:#216e7f"></span>Highway (4 lanes)</div>
    <div class="leg"><span class="swatch" style="background:#2f3344"></span>Intersection</div>
  </div>
  <div id="zoom-tip">Wheel: zoom | Drag: pan</div>
</div>

<script>
const EMPTY = 0;
const LOCAL = 1;
const MAIN = 2;
const HIGHWAY = 3;
const INTER = 4;

const GRID_W = 64;
const GRID_H = 46;
const CELL = 24;

const ROAD_RANK = { [LOCAL]: 1, [MAIN]: 2, [HIGHWAY]: 3 };
const CLASS_BIT = { [LOCAL]: 1, [MAIN]: 2, [HIGHWAY]: 4 };
const ROAD_COLOR = { [LOCAL]: '#3f485d', [MAIN]: '#2f638f', [HIGHWAY]: '#1e7f90' };

const C = {
  bg: '#131722',
  fringe: '#0e121b',
  fringe2: '#101725',
  block: '#1d2231',
  blockAlt: '#192031',
  lot: '#243048',
  lotAlt: '#283552',
  roofA: '#5f6d8a',
  roofB: '#6c7c9b',
  inter: '#2f3344',
  lane: 'rgba(214,222,240,0.18)',
  laneSoft: 'rgba(214,222,240,0.11)',
  hwyEdge: 'rgba(190,230,240,0.22)',
  hwyMedian: 'rgba(12,28,35,0.56)',
  carStop: '#e76464',
  carShadow: 'rgba(0,0,0,0.45)',
  headlight: 'rgba(255,245,170,0.55)',
};

let grid = [];
let dirGrid = [];
let interMask = [];
let cityMask = [];
let buildingCache = [];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const view = {
  zoom: 1,
  minZoom: 0.45,
  maxZoom: 2.8,
  panX: 0,
  panY: 0,
  dragging: false,
  dragStartX: 0,
  dragStartY: 0,
};

const WORLD_W = GRID_W * CELL;
const WORLD_H = GRID_H * CELL;

function create2D(h, w, fillVal) {
  return new Array(h).fill(null).map(() => new Array(w).fill(fillVal));
}

function resetArrays() {
  grid = create2D(GRID_H, GRID_W, EMPTY);
  dirGrid = create2D(GRID_H, GRID_W, null);
  interMask = create2D(GRID_H, GRID_W, 0);
  cityMask = create2D(GRID_H, GRID_W, false);
}

function inBounds(x, y) {
  return x >= 0 && y >= 0 && x < GRID_W && y < GRID_H;
}

function inCity(x, y) {
  return inBounds(x, y) && cityMask[y][x];
}

function isDrivable(x, y) {
  return inCity(x, y) && grid[y][x] !== EMPTY;
}

function setRoad(x, y, roadType, dir) {
  if (!inCity(x, y)) return;
  const cur = grid[y][x];
  const curDir = dirGrid[y][x];

  if (cur === EMPTY) {
    grid[y][x] = roadType;
    dirGrid[y][x] = dir;
    return;
  }

  if (cur === INTER) {
    interMask[y][x] |= CLASS_BIT[roadType] || 0;
    return;
  }

  if (curDir === dir) {
    grid[y][x] = ROAD_RANK[roadType] > ROAD_RANK[cur] ? roadType : cur;
    return;
  }

  grid[y][x] = INTER;
  dirGrid[y][x] = 'b';
  interMask[y][x] = (CLASS_BIT[cur] || 0) | (CLASS_BIT[roadType] || 0);
}

function buildCity() {
  resetArrays();

  const clampI = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  function buildCityMask() {
    const cx = GRID_W * 0.52;
    const cy = GRID_H * 0.53;
    const rx = GRID_W * 0.50;
    const ry = GRID_H * 0.46;

    for (let y = 0; y < GRID_H; y++) {
      for (let x = 0; x < GRID_W; x++) {
        const nx = (x - cx) / rx;
        const ny = (y - cy) / ry;
        const ang = Math.atan2(ny, nx);
        const wobble =
          0.12 * Math.sin(ang * 3.0 + 0.8) +
          0.08 * Math.sin(ang * 5.0 - 1.4) +
          0.05 * Math.sin((x + y) * 0.12);
        const d = Math.pow(Math.abs(nx), 2.2) + Math.pow(Math.abs(ny), 2.2);
        cityMask[y][x] = d <= (1.0 + wobble);
      }
    }
  }

  buildCityMask();

  function uniqueStarts(base, count, minGap, maxVal) {
    const out = [];
    let cur = base;
    for (let i = 0; i < count; i++) {
      cur += minGap + (Math.random() * minGap | 0);
      if (cur >= maxVal - 2) break;
      out.push(cur);
    }
    return out;
  }

  function carveHorizontal(startY, roadType, turnChance = 0.14) {
    let y = clampI(startY, 1, GRID_H - 2);
    for (let x = 0; x < GRID_W; x++) {
      setRoad(x, y, roadType, 'h');
      if (roadType !== HIGHWAY && x > 2 && x < GRID_W - 3 && Math.random() < turnChance) {
        const nextY = clampI(y + (Math.random() < 0.5 ? -1 : 1), 1, GRID_H - 2);
        if (nextY !== y) {
          setRoad(x, nextY, roadType, 'v');
          y = nextY;
          setRoad(x, y, roadType, 'h');
        }
      }
    }
  }

  function carveVertical(startX, roadType, turnChance = 0.14) {
    let x = clampI(startX, 1, GRID_W - 2);
    for (let y = 0; y < GRID_H; y++) {
      setRoad(x, y, roadType, 'v');
      if (roadType !== HIGHWAY && y > 2 && y < GRID_H - 3 && Math.random() < turnChance) {
        const nextX = clampI(x + (Math.random() < 0.5 ? -1 : 1), 1, GRID_W - 2);
        if (nextX !== x) {
          setRoad(nextX, y, roadType, 'h');
          x = nextX;
          setRoad(x, y, roadType, 'v');
        }
      }
    }
  }

  function carveClosedHighwayLoop(left, top, right, bottom, wobble = 0) {
    const lx = clampI(left, 1, GRID_W - 2);
    const rx = clampI(right, lx + 2, GRID_W - 1);
    const ty = clampI(top, 1, GRID_H - 2);
    const by = clampI(bottom, ty + 2, GRID_H - 1);
    const topPath = [];
    const rightPath = [];
    const bottomPath = [];
    const leftPath = [];

    const pushTile = (x, y, dir) => {
      if (!inBounds(x, y)) return;
      cityMask[y][x] = true;
      setRoad(x, y, HIGHWAY, dir);
    };

    const stitch = (ax, ay, bx, by) => {
      let x = ax;
      let y = ay;
      pushTile(x, y, 'h');
      while (x !== bx) {
        x += Math.sign(bx - x);
        pushTile(x, y, 'h');
      }
      while (y !== by) {
        y += Math.sign(by - y);
        pushTile(x, y, 'v');
      }
    };

    for (let x = lx; x <= rx; x++) {
      const y = clampI(ty + Math.round(Math.sin((x - lx) / Math.max(1, rx - lx) * Math.PI) * wobble), 1, GRID_H - 2);
      topPath.push([x, y]);
    }
    for (let y = ty; y <= by; y++) {
      const x = clampI(rx + Math.round(Math.sin((y - ty) / Math.max(1, by - ty) * Math.PI) * wobble), 1, GRID_W - 2);
      rightPath.push([x, y]);
    }
    for (let x = rx; x >= lx; x--) {
      const y = clampI(by - Math.round(Math.sin((rx - x) / Math.max(1, rx - lx) * Math.PI) * wobble), 1, GRID_H - 2);
      bottomPath.push([x, y]);
    }
    for (let y = by; y >= ty; y--) {
      const x = clampI(lx - Math.round(Math.sin((by - y) / Math.max(1, by - ty) * Math.PI) * wobble), 1, GRID_W - 2);
      leftPath.push([x, y]);
    }

    const loop = topPath
      .concat(rightPath.slice(1))
      .concat(bottomPath.slice(1))
      .concat(leftPath.slice(1));

    for (let i = 1; i < loop.length; i++) {
      stitch(loop[i - 1][0], loop[i - 1][1], loop[i][0], loop[i][1]);
    }
    if (loop.length > 1) {
      stitch(loop[loop.length - 1][0], loop[loop.length - 1][1], loop[0][0], loop[0][1]);
    }
  }

  // Closed highway loops: no dead-end highway tiles.
  const outerLeft = clampI(Math.floor(GRID_W * 0.12), 2, GRID_W - 8);
  const outerRight = clampI(Math.floor(GRID_W * 0.88), outerLeft + 8, GRID_W - 3);
  const outerTop = clampI(Math.floor(GRID_H * 0.16), 2, GRID_H - 8);
  const outerBottom = clampI(Math.floor(GRID_H * 0.84), outerTop + 8, GRID_H - 3);

  const innerLeft = clampI(Math.floor(GRID_W * 0.30), 4, GRID_W - 10);
  const innerRight = clampI(Math.floor(GRID_W * 0.70), innerLeft + 8, GRID_W - 4);
  const innerTop = clampI(Math.floor(GRID_H * 0.34), 4, GRID_H - 10);
  const innerBottom = clampI(Math.floor(GRID_H * 0.66), innerTop + 8, GRID_H - 4);

  carveClosedHighwayLoop(outerLeft, outerTop, outerRight, outerBottom, 1);
  carveClosedHighwayLoop(innerLeft, innerTop, innerRight, innerBottom, 1);

  // Main roads cross the loops and form the city's internal structure.
  const hMain = uniqueStarts(2, 5, 7, GRID_H).filter(y => y !== outerTop && y !== outerBottom && y !== innerTop && y !== innerBottom);
  const vMain = uniqueStarts(3, 6, 9, GRID_W).filter(x => x !== outerLeft && x !== outerRight && x !== innerLeft && x !== innerRight);
  for (const y of hMain) carveHorizontal(y, MAIN, 0.13);
  for (const x of vMain) carveVertical(x, MAIN, 0.13);

  // Local streets branch off main roads and then off other local streets.
  function carveLocalBranch(seedX, seedY, maxLen) {
    let x = seedX;
    let y = seedY;
    let horizontal = Math.random() < 0.5;
    for (let k = 0; k < maxLen; k++) {
      x += horizontal ? (Math.random() < 0.5 ? -1 : 1) : 0;
      y += horizontal ? 0 : (Math.random() < 0.5 ? -1 : 1);
      if (!inBounds(x, y) || !inCity(x, y)) break;
      if (grid[y][x] !== EMPTY) break;
      setRoad(x, y, LOCAL, horizontal ? 'h' : 'v');
      if (Math.random() < 0.18) horizontal = !horizontal;
    }
  }

  const mainSeeds = [];
  const localSeeds = [];
  for (let y = 1; y < GRID_H - 1; y++) {
    for (let x = 1; x < GRID_W - 1; x++) {
      if (grid[y][x] === MAIN) mainSeeds.push({x, y});
      if (grid[y][x] === LOCAL) localSeeds.push({x, y});
    }
  }

  const localBranchesFromMain = Math.floor((GRID_W * GRID_H) * 0.075);
  for (let i = 0; i < localBranchesFromMain; i++) {
    const seed = mainSeeds[Math.random() * mainSeeds.length | 0];
    if (!seed) continue;
    carveLocalBranch(seed.x, seed.y, 3 + (Math.random() * 6 | 0));
  }

  const localBranchesFromLocal = Math.floor((GRID_W * GRID_H) * 0.045);
  for (let i = 0; i < localBranchesFromLocal; i++) {
    const seed = localSeeds[Math.random() * localSeeds.length | 0];
    if (!seed) continue;
    carveLocalBranch(seed.x, seed.y, 2 + (Math.random() * 4 | 0));
  }

  function roadClassAt(x, y) {
    const t = grid[y][x];
    if (t === HIGHWAY || t === MAIN || t === LOCAL) return t;
    if (t === INTER) {
      const mask = interMask[y][x] || 0;
      if (mask & CLASS_BIT[HIGHWAY]) return HIGHWAY;
      if (mask & CLASS_BIT[MAIN]) return MAIN;
      return LOCAL;
    }
    return null;
  }

  function orientFromPair(a, b) {
    const sameX = a.x === b.x;
    const sameY = a.y === b.y;
    if (sameY) return 'h';
    if (sameX) return 'v';
    return null;
  }

  // Smart intersection cleanup: keep true junctions, downgrade fake/degenerate ones.
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (grid[y][x] !== INTER) continue;

      const nbrs = [];
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      for (const d of dirs) {
        const nx = x + d[0];
        const ny = y + d[1];
        if (!inCity(nx, ny)) continue;
        if (grid[ny][nx] === EMPTY) continue;
        nbrs.push({ x: nx, y: ny, t: grid[ny][nx], cls: roadClassAt(nx, ny) });
      }

      if (nbrs.length <= 1) {
        if (nbrs.length === 0) {
          grid[y][x] = EMPTY;
          dirGrid[y][x] = null;
          interMask[y][x] = 0;
          continue;
        }
        grid[y][x] = nbrs[0].cls || LOCAL;
        dirGrid[y][x] = (nbrs[0].x === x) ? 'v' : 'h';
        interMask[y][x] = 0;
        continue;
      }

      if (nbrs.length === 2) {
        const dir = orientFromPair(nbrs[0], nbrs[1]);
        if (dir !== null) {
          const cls = Math.max(nbrs[0].cls || LOCAL, nbrs[1].cls || LOCAL);
          grid[y][x] = cls;
          dirGrid[y][x] = dir;
          interMask[y][x] = 0;
          continue;
        }
      }

      // True junction (3+ connections, or 2-way corner) stays intersection.
      let mask = 0;
      for (const n of nbrs) {
        if (n.cls != null) mask |= CLASS_BIT[n.cls];
      }
      interMask[y][x] = mask || (CLASS_BIT[LOCAL] | CLASS_BIT[MAIN]);
      dirGrid[y][x] = 'b';
    }
  }

  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (grid[y][x] === INTER && interMask[y][x] === 0) {
        interMask[y][x] = CLASS_BIT[LOCAL] | CLASS_BIT[MAIN];
      }
    }
  }
}

function tileClass(x, y) {
  const t = grid[y][x];
  if (t === LOCAL || t === MAIN || t === HIGHWAY) return t;
  return null;
}

function canConnectClass(aClass, bClass) {
  if (aClass == null || bClass == null) return false;
  if (aClass === HIGHWAY && bClass === LOCAL) return false;
  if (aClass === LOCAL && bClass === HIGHWAY) return false;
  return true;
}

function dirCompatible(dir, dx, dy) {
  if (dir === 'h') return dy === 0;
  if (dir === 'v') return dx === 0;
  return true;
}

function intersectionAccepts(ix, iy, roadClass) {
  if (grid[iy][ix] !== INTER) return true;
  return (interMask[iy][ix] & CLASS_BIT[roadClass]) !== 0;
}

function neighbours(x, y) {
  const dirs = [{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}];
  const out = [];
  const srcType = grid[y][x];
  const srcClass = srcType === INTER ? null : srcType;
  const srcDir = dirGrid[y][x];

  for (const d of dirs) {
    const nx = x + d.dx;
    const ny = y + d.dy;
    if (!isDrivable(nx, ny)) continue;

    const dstType = grid[ny][nx];
    const dstClass = dstType === INTER ? null : dstType;
    const dstDir = dirGrid[ny][nx];

    if (!dirCompatible(srcDir, d.dx, d.dy)) continue;
    if (!dirCompatible(dstDir, d.dx, d.dy)) continue;

    if (srcType !== INTER && dstType !== INTER) {
      if (!canConnectClass(srcClass, dstClass)) continue;
    }

    if (srcType === INTER && dstType !== INTER) {
      if (!intersectionAccepts(x, y, dstClass)) continue;
    }

    if (srcType !== INTER && dstType === INTER) {
      if (!intersectionAccepts(nx, ny, srcClass)) continue;
    }

    if (srcType === INTER && dstType === INTER) {
      const mask = interMask[y][x] & interMask[ny][nx];
      if (mask === 0) continue;
    }

    out.push({ x: nx, y: ny, dx: d.dx, dy: d.dy });
  }
  return out;
}

function moveCost(x, y) {
  const t = grid[y][x];
  if (t === HIGHWAY) return 1;
  if (t === MAIN) return 2;
  if (t === LOCAL) return 3;
  return 2;
}

function heuristic(ax, ay, bx, by) {
  return Math.abs(ax - bx) + Math.abs(ay - by);
}

function astar(sx, sy, gx, gy) {
  if (sx === gx && sy === gy) return [{x: sx, y: sy, dx: 0, dy: 0}];

  const key = (x, y) => y * GRID_W + x;
  const open = [{x: sx, y: sy, g: 0, f: heuristic(sx, sy, gx, gy), dx: 0, dy: 0}];
  const gScore = { [key(sx, sy)]: 0 };
  const from = {};

  while (open.length) {
    open.sort((a, b) => a.f - b.f);
    const cur = open.shift();
    if (cur.x === gx && cur.y === gy) {
      const path = [];
      let node = cur;
      while (node) {
        path.unshift(node);
        node = from[key(node.x, node.y)] || null;
      }
      return path;
    }

    for (const nb of neighbours(cur.x, cur.y)) {
      const ng = (gScore[key(cur.x, cur.y)] ?? Infinity) + moveCost(nb.x, nb.y);
      const nbKey = key(nb.x, nb.y);
      if (ng < (gScore[nbKey] ?? Infinity)) {
        gScore[nbKey] = ng;
        from[nbKey] = cur;
        open.push({ x: nb.x, y: nb.y, g: ng, f: ng + heuristic(nb.x, nb.y, gx, gy), dx: nb.dx, dy: nb.dy });
      }
    }
  }

  return null;
}

let carIdCounter = 0;

function laneOffsetForClass(roadClass) {
  if (roadClass === HIGHWAY) return [4, 9];
  if (roadClass === MAIN) return [5];
  return [4];
}

function lanePoint(gx, gy, dx, dy, laneIndex) {
  const cx = gx * CELL + CELL / 2;
  const cy = gy * CELL + CELL / 2;
  const t = grid[gy][gx];
  if (t === INTER || (dx === 0 && dy === 0)) return { x: cx, y: cy };

  const roadClass = t;
  const choices = laneOffsetForClass(roadClass);
  const lane = choices[Math.min(laneIndex, choices.length - 1)];

  if (dx !== 0) {
    return { x: cx, y: cy + (dx > 0 ? lane : -lane) };
  }
  return { x: cx + (dy > 0 ? lane : -lane), y: cy };
}

class Car {
  constructor(x, y, gx, gy, path) {
    this.id = carIdCounter++;
    this.x = x;
    this.y = y;
    this.gx = gx;
    this.gy = gy;
    this.path = path.slice(1);
    this.dx = 0;
    this.dy = 0;
    if (path.length > 1) {
      this.dx = path[1].dx;
      this.dy = path[1].dy;
    }
    const klass = tileClass(x, y) || MAIN;
    this.laneIndex = klass === HIGHWAY ? (Math.random() < 0.5 ? 0 : 1) : 0;
    const p = lanePoint(x, y, this.dx, this.dy, this.laneIndex);
    this.rx = p.x;
    this.ry = p.y;
    this.targetRx = p.x;
    this.targetRy = p.y;
    this.travelTime = 0;
    this.stopped = false;
    this.len = 9 + (Math.random() * 4 | 0);
    this.wid = 5;
    this.color = Math.random() < 0.2 ? '#7cb6f5' : (Math.random() < 0.2 ? '#95de7f' : '#f4c24f');
  }

  get arrived() {
    return this.x === this.gx && this.y === this.gy;
  }

  nextStep() {
    return this.path.length ? this.path[0] : null;
  }

  advance() {
    const nxt = this.path.shift();
    this.dx = nxt.dx;
    this.dy = nxt.dy;
    this.x = nxt.x;
    this.y = nxt.y;
    const klass = tileClass(this.x, this.y) || MAIN;
    if (klass !== HIGHWAY) this.laneIndex = 0;
    else if (Math.random() < 0.05) this.laneIndex = this.laneIndex === 0 ? 1 : 0;
    const p = lanePoint(this.x, this.y, this.dx, this.dy, this.laneIndex);
    this.targetRx = p.x;
    this.targetRy = p.y;
    this.travelTime++;
    this.stopped = false;
  }

  tickStopped() {
    this.stopped = true;
    this.travelTime++;
  }

  updateRender(dt) {
    const speed = this.stopped ? 7 : 11;
    this.rx += (this.targetRx - this.rx) * Math.min(1, dt * speed);
    this.ry += (this.targetRy - this.ry) * Math.min(1, dt * speed);
  }
}

const MAX_CARS = 140;
const SPAWN_RATE = 0.62;
let cars = [];
let completed = [];
let occupied = new Set();
let interLocks = new Set();
let tickCount = 0;
let stoppedCount = 0;

function oKey(x, y) {
  return x + ',' + y;
}

function drivableTiles() {
  const out = [];
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (isDrivable(x, y)) out.push({x, y});
    }
  }
  return out;
}

function simReset() {
  cars = [];
  completed = [];
  occupied = new Set();
  interLocks = new Set();
  tickCount = 0;
  stoppedCount = 0;
  carIdCounter = 0;
}

function spawnCar() {
  if (cars.length >= MAX_CARS) return;
  if (Math.random() > SPAWN_RATE) return;

  const tiles = drivableTiles();
  if (tiles.length < 2) return;

  let tries = 0;
  while (tries < 18) {
    const start = tiles[Math.random() * tiles.length | 0];
    const dest = tiles[Math.random() * tiles.length | 0];

    if (start.x === dest.x && start.y === dest.y) { tries++; continue; }
    if (occupied.has(oKey(start.x, start.y))) { tries++; continue; }

    const path = astar(start.x, start.y, dest.x, dest.y);
    if (!path || path.length < 2) { tries++; continue; }

    const car = new Car(start.x, start.y, dest.x, dest.y, path);
    cars.push(car);
    occupied.add(oKey(start.x, start.y));
    return;
  }
}

function simStep() {
  tickCount++;
  interLocks.clear();
  stoppedCount = 0;

  for (let i = cars.length - 1; i > 0; i--) {
    const j = Math.random() * (i + 1) | 0;
    const t = cars[i];
    cars[i] = cars[j];
    cars[j] = t;
  }

  for (const car of cars) {
    car.stopped = false;
    let nxt = car.nextStep();

    if (!nxt) {
      if (!car.arrived) {
        const p = astar(car.x, car.y, car.gx, car.gy);
        if (p && p.length > 1) {
          car.path = p.slice(1);
          nxt = car.nextStep();
        }
      }
    }

    if (!nxt) {
      car.tickStopped();
      stoppedCount++;
      continue;
    }

    const nKey = oKey(nxt.x, nxt.y);
    if (occupied.has(nKey)) {
      car.tickStopped();
      stoppedCount++;
      continue;
    }

    if (grid[nxt.y][nxt.x] === INTER) {
      if (interLocks.has(nKey)) {
        car.tickStopped();
        stoppedCount++;
        continue;
      }
      interLocks.add(nKey);
    }

    occupied.delete(oKey(car.x, car.y));
    car.advance();
    occupied.add(oKey(car.x, car.y));
  }

  cars = cars.filter(car => {
    if (car.arrived) {
      occupied.delete(oKey(car.x, car.y));
      completed.push(car);
      return false;
    }
    return true;
  });

  spawnCar();
}

function generateBuildings() {
  function hasResidentialFrontage(x, y) {
    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (const d of dirs) {
      const nx = x + d[0];
      const ny = y + d[1];
      if (!inCity(nx, ny)) continue;
      const t = grid[ny][nx];
      if (t === LOCAL || t === MAIN) return true;
      if (t === INTER) {
        const mask = interMask[ny][nx] || 0;
        if ((mask & CLASS_BIT[LOCAL]) || (mask & CLASS_BIT[MAIN])) return true;
      }
    }
    return false;
  }

  function frontageType(x, y) {
    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    let hasLocal = false;
    let hasMain = false;
    for (const d of dirs) {
      const nx = x + d[0];
      const ny = y + d[1];
      if (!inCity(nx, ny)) continue;
      const t = grid[ny][nx];
      if (t === MAIN) hasMain = true;
      if (t === LOCAL) hasLocal = true;
      if (t === INTER) {
        const mask = interMask[ny][nx] || 0;
        if (mask & CLASS_BIT[MAIN]) hasMain = true;
        if (mask & CLASS_BIT[LOCAL]) hasLocal = true;
      }
    }
    if (hasLocal) return LOCAL;
    if (hasMain) return MAIN;
    return null;
  }

  function lotFillChance(x, y) {
    const cx = (GRID_W - 1) / 2;
    const cy = (GRID_H - 1) / 2;
    const dx = (x - cx) / (GRID_W / 2);
    const dy = (y - cy) / (GRID_H / 2);
    const dist = Math.min(1, Math.sqrt(dx * dx + dy * dy));
    const coreBias = 0.64 + (1 - dist) * 0.20;
    const frontage = frontageType(x, y);
    const frontageBias = frontage === LOCAL ? 0.34 : frontage === MAIN ? 0.02 : 0.0;
    return Math.min(0.98, coreBias + frontageBias);
  }

  buildingCache = [];
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (!inCity(x, y)) continue;
      if (grid[y][x] !== EMPTY) continue;
      if (!hasResidentialFrontage(x, y)) continue;

      // Density is heavier near the city core and along main streets.
      // Edge lots and local-frontage parcels stay more open.
      if (Math.random() > lotFillChance(x, y)) continue;

      const px = x * CELL;
      const py = y * CELL;
      const blocks = [];
      const count = 1 + (Math.random() * 2 | 0);
      for (let i = 0; i < count; i++) {
        const m = 4;
        const bw = 6 + (Math.random() * (CELL - 2 * m - 7) | 0);
        const bh = 6 + (Math.random() * (CELL - 2 * m - 7) | 0);
        const bx = m + (Math.random() * Math.max(1, CELL - 2 * m - bw) | 0);
        const by = m + (Math.random() * Math.max(1, CELL - 2 * m - bh) | 0);
        blocks.push({bx, by, bw, bh, dark: Math.random() < 0.5, round: 1 + (Math.random() * 3 | 0)});
      }
      buildingCache.push({px, py, blocks, toneDark: Math.random() < 0.5, pad: 2 + (Math.random() * 2 | 0)});
    }
  }
}

const ROAD_WIDTH = { [LOCAL]: 9, [MAIN]: 13, [HIGHWAY]: 19, [INTER]: 15 };

function centerOf(x, y) {
  return { x: x * CELL + CELL / 2, y: y * CELL + CELL / 2 };
}

function connectionClass(ax, ay, bx, by) {
  const a = grid[ay][ax];
  const b = grid[by][bx];
  if (a === INTER && b === INTER) return MAIN;
  if (a === INTER) return b;
  if (b === INTER) return a;
  return ROAD_RANK[a] >= ROAD_RANK[b] ? a : b;
}

function drawRoadLink(a, b, roadType, shadow = false) {
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = shadow ? 'rgba(0,0,0,0.28)' : ROAD_COLOR[roadType];
  ctx.lineWidth = ROAD_WIDTH[roadType] + (shadow ? 4 : 0);
  ctx.stroke();

  if (!shadow && roadType === HIGHWAY) {
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = ROAD_WIDTH[HIGHWAY] * 0.64;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }
}

function drawLaneDashes(a, b, roadType) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const len = Math.hypot(dx, dy);
  if (len < 2) return;

  const nx = -dy / len;
  const ny = dx / len;
  ctx.lineCap = 'round';

  if (roadType === HIGHWAY) {
    for (const off of [-6.5, 6.5]) {
      ctx.strokeStyle = C.hwyEdge;
      ctx.lineWidth = 1;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(a.x + nx * off, a.y + ny * off);
      ctx.lineTo(b.x + nx * off, b.y + ny * off);
      ctx.stroke();
    }

    for (const off of [-2.2, 2.2]) {
      ctx.strokeStyle = C.laneSoft;
      ctx.lineWidth = 1;
      ctx.setLineDash([5, 6]);
      ctx.beginPath();
      ctx.moveTo(a.x + nx * off, a.y + ny * off);
      ctx.lineTo(b.x + nx * off, b.y + ny * off);
      ctx.stroke();
    }

    ctx.strokeStyle = C.hwyMedian;
    ctx.lineWidth = 2;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    return;
  }

  ctx.strokeStyle = C.lane;
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 5]);
  for (const off of [0]) {
    ctx.beginPath();
    ctx.moveTo(a.x + nx * off, a.y + ny * off);
    ctx.lineTo(b.x + nx * off, b.y + ny * off);
    ctx.stroke();
  }
  ctx.setLineDash([]);
}

function drawRoadNetwork() {
  const links = [];
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (!isDrivable(x, y)) continue;
      if (isDrivable(x + 1, y)) {
        links.push({
          a: centerOf(x, y),
          b: centerOf(x + 1, y),
          t: connectionClass(x, y, x + 1, y),
        });
      }
      if (isDrivable(x, y + 1)) {
        links.push({
          a: centerOf(x, y),
          b: centerOf(x, y + 1),
          t: connectionClass(x, y, x, y + 1),
        });
      }
    }
  }

  links.sort((a, b) => ROAD_RANK[a.t] - ROAD_RANK[b.t]);
  for (const l of links) drawRoadLink(l.a, l.b, l.t, true);
  for (const l of links) drawRoadLink(l.a, l.b, l.t, false);
  for (const l of links) drawLaneDashes(l.a, l.b, l.t);

  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (grid[y][x] !== INTER) continue;
      const c = centerOf(x, y);
      ctx.fillStyle = C.inter;
      ctx.beginPath();
      ctx.arc(c.x, c.y, ROAD_WIDTH[INTER] * 0.62, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawCar(car) {
  const angle = Math.atan2(car.dy, car.dx);
  ctx.save();
  ctx.translate(car.rx, car.ry);
  ctx.rotate(angle);

  const l = car.len;
  const w = car.wid;

  ctx.fillStyle = C.carShadow;
  ctx.beginPath();
  ctx.ellipse(1.5, 1.5, l / 2 + 1, w / 2 + 1, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = car.stopped ? C.carStop : car.color;
  ctx.beginPath();
  ctx.roundRect(-l / 2, -w / 2, l, w, 2);
  ctx.fill();

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(-l / 2 + 2, -w / 2 + 1, l - 4, w - 2);

  if (!car.stopped) {
    ctx.fillStyle = C.headlight;
    ctx.beginPath();
    ctx.ellipse(l / 2 + 2.8, 0, 5.2, 1.8, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function drawWorld() {
  ctx.fillStyle = C.fringe;
  ctx.fillRect(0, 0, WORLD_W, WORLD_H);

  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (cityMask[y][x]) continue;
      const px = x * CELL;
      const py = y * CELL;
      ctx.fillStyle = ((x + y) % 3 === 0) ? C.fringe2 : C.fringe;
      ctx.fillRect(px, py, CELL, CELL);
    }
  }

  for (const b of buildingCache) {
    const pad = b.pad;
    ctx.fillStyle = b.toneDark ? C.lot : C.lotAlt;
    ctx.beginPath();
    ctx.roundRect(b.px + pad, b.py + pad, CELL - pad * 2, CELL - pad * 2, 5);
    ctx.fill();
    for (const r of b.blocks) {
      ctx.fillStyle = r.dark ? C.roofA : C.roofB;
      ctx.beginPath();
      ctx.roundRect(b.px + r.bx, b.py + r.by, r.bw, r.bh, r.round);
      ctx.fill();
    }
  }

  drawRoadNetwork();

  for (const car of cars) drawCar(car);
}

function drawScene() {
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(view.panX, view.panY);
  ctx.scale(view.zoom, view.zoom);
  drawWorld();
  ctx.restore();
}

function updateStats() {
  document.getElementById('s-tick').textContent = tickCount;
  document.getElementById('s-cars').textContent = cars.length;
  document.getElementById('s-done').textContent = completed.length;
  document.getElementById('s-stop').textContent = stoppedCount;
  const all = cars.concat(completed);
  const avg = all.length ? (all.reduce((s, c) => s + c.travelTime, 0) / all.length).toFixed(1) : '0.0';
  document.getElementById('s-avg').textContent = avg;
  document.getElementById('s-zoom').textContent = Math.round(view.zoom * 100) + '%';
}

function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

function resetView() {
  const fit = Math.min(canvas.width / WORLD_W, canvas.height / WORLD_H) * 0.94;
  view.zoom = clamp(fit, view.minZoom, view.maxZoom);
  view.panX = (canvas.width - WORLD_W * view.zoom) / 2;
  view.panY = (canvas.height - WORLD_H * view.zoom) / 2;
}

function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  resetView();
}

function zoomAt(screenX, screenY, factor) {
  const oldZoom = view.zoom;
  const newZoom = clamp(oldZoom * factor, view.minZoom, view.maxZoom);
  if (newZoom === oldZoom) return;

  const worldX = (screenX - view.panX) / oldZoom;
  const worldY = (screenY - view.panY) / oldZoom;
  view.zoom = newZoom;
  view.panX = screenX - worldX * newZoom;
  view.panY = screenY - worldY * newZoom;
}

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 0.89;
  zoomAt(e.offsetX, e.offsetY, factor);
}, { passive: false });

canvas.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  view.dragging = true;
  view.dragStartX = e.clientX - view.panX;
  view.dragStartY = e.clientY - view.panY;
  canvas.classList.add('dragging');
});

window.addEventListener('mousemove', (e) => {
  if (!view.dragging) return;
  view.panX = e.clientX - view.dragStartX;
  view.panY = e.clientY - view.dragStartY;
});

window.addEventListener('mouseup', () => {
  view.dragging = false;
  canvas.classList.remove('dragging');
});

window.addEventListener('resize', resizeCanvas);

let paused = false;
let speedMult = 1;
let tickAccum = 0;
let lastTime = 0;
const tickInterval = 120;

function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.1);
  lastTime = ts;

  if (!paused) {
    tickAccum += dt * 1000;
    const interval = tickInterval / speedMult;
    while (tickAccum >= interval) {
      simStep();
      tickAccum -= interval;
    }
  }

  for (const car of cars) car.updateRender(dt);

  drawScene();
  updateStats();
  requestAnimationFrame(loop);
}

function setSpeed(mult) {
  speedMult = mult;
  document.getElementById('btn-slow').classList.remove('active');
  document.getElementById('btn-norm').classList.remove('active');
  document.getElementById('btn-fast').classList.remove('active');
  document.getElementById(mult === 0.5 ? 'btn-slow' : mult === 1 ? 'btn-norm' : 'btn-fast').classList.add('active');
}

document.getElementById('btn-slow').onclick = () => setSpeed(0.5);
document.getElementById('btn-norm').onclick = () => setSpeed(1);
document.getElementById('btn-fast').onclick = () => setSpeed(3);

document.getElementById('btn-pause').onclick = function() {
  paused = !paused;
  this.textContent = paused ? 'Resume' : 'Pause';
  this.classList.toggle('active', paused);
};

document.getElementById('btn-zin').onclick = () => zoomAt(canvas.width * 0.5, canvas.height * 0.5, 1.12);
document.getElementById('btn-zout').onclick = () => zoomAt(canvas.width * 0.5, canvas.height * 0.5, 0.89);
document.getElementById('btn-zreset').onclick = () => resetView();

buildCity();
generateBuildings();
simReset();
for (let i = 0; i < 20; i++) spawnCar();
resizeCanvas();
requestAnimationFrame((ts) => {
  lastTime = ts;
  requestAnimationFrame(loop);
});
</script>
