<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CityFlow</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #171a22;
    --surface: #1f2430;
    --border: #31394b;
    --text: #c8d0df;
    --muted: #73809b;
    --accent: #f4c24f;
    --local: #3f485d;
    --main: #2f638f;
    --highway: #216e7f;
    --inter: #2f3344;
    --block: #1d202b;
    --block-alt: #1a1d27;
  }

  body {
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(1200px 600px at 40% -20%, #273147 0%, #171a22 60%);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    display: flex;
    flex-direction: column;
  }

  #header {
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(31, 36, 48, 0.95);
    backdrop-filter: blur(4px);
    flex-shrink: 0;
  }

  #header h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--accent);
    white-space: nowrap;
  }

  .stats {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    flex: 1;
  }

  .stat {
    min-width: 72px;
    text-align: center;
  }

  .stat .v {
    display: block;
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    line-height: 1.1;
  }

  .stat .l {
    display: block;
    margin-top: 1px;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .controls {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  button {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 5px 10px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  button:hover { border-color: var(--accent); color: var(--accent); }
  button.active { border-color: var(--accent); color: var(--accent); background: rgba(244,194,79,0.1); }

  #canvas-wrap {
    position: relative;
    flex: 1;
    overflow: hidden;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
  }

  canvas.dragging { cursor: grabbing; }

  #legend {
    position: absolute;
    right: 12px;
    bottom: 12px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    background: rgba(29, 33, 44, 0.9);
    font-size: 10px;
    line-height: 1.75;
  }

  .leg { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .swatch { width: 14px; height: 8px; border-radius: 8px; }

  #zoom-tip {
    position: absolute;
    left: 12px;
    bottom: 12px;
    font-size: 10px;
    color: var(--muted);
    background: rgba(29, 33, 44, 0.9);
    border: 1px solid var(--border);
    padding: 8px 10px;
  }

  #gen-progress {
    position: absolute;
    left: 12px;
    top: 12px;
    min-width: 260px;
    max-width: 360px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    background: rgba(29, 33, 44, 0.92);
    font-size: 11px;
    line-height: 1.5;
    color: var(--text);
    z-index: 20;
    display: none;
  }

  #gen-progress .title {
    color: var(--accent);
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }

  #gen-progress .bar {
    height: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
    margin: 6px 0;
  }

  #gen-progress .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #4eb2c3, #f4c24f);
    transition: width 0.15s linear;
  }

  #gen-progress .meta {
    color: var(--muted);
    white-space: pre-line;
    font-size: 10px;
  }

  #tune-panel {
    position: absolute;
    right: 12px;
    top: 12px;
    width: min(320px, calc(100vw - 24px));
    max-height: calc(100vh - 140px);
    overflow: auto;
    padding: 10px 12px;
    border: 1px solid var(--border);
    background: rgba(29, 33, 44, 0.94);
    font-size: 11px;
    z-index: 18;
  }

  #tune-panel .title {
    color: var(--accent);
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }

  .tune-group {
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }

  .tune-group:last-of-type {
    border-bottom: none;
    margin-bottom: 8px;
  }

  .tune-group h3 {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .tune-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px;
    align-items: center;
    margin-bottom: 6px;
  }

  .tune-row label {
    font-size: 10px;
    color: var(--text);
  }

  .tune-row .val {
    min-width: 34px;
    text-align: right;
    color: var(--accent);
    font-size: 10px;
  }

  .tune-row input[type='range'] {
    grid-column: 1 / -1;
    width: 100%;
  }

  .tune-actions {
    display: flex;
    gap: 8px;
  }

  .tune-actions button {
    flex: 1;
  }

  @media (max-width: 900px) {
    #header { gap: 10px; padding: 8px 10px; }
    #header h1 { font-size: 12px; }
    .stats { gap: 10px; }
    .stat { min-width: 58px; }
    .stat .v { font-size: 13px; }
    .controls { justify-content: center; }
    #tune-panel {
      width: min(300px, calc(100vw - 24px));
      max-height: 48vh;
      top: auto;
      bottom: 52px;
    }
  }
</style>
</head>
<body>

<div id="header">
  <h1>CityFlow</h1>
  <div class="stats">
    <div class="stat"><span class="v" id="s-tick">0</span><span class="l">Tick</span></div>
    <div class="stat"><span class="v" id="s-cars">0</span><span class="l">Active</span></div>
    <div class="stat"><span class="v" id="s-done">0</span><span class="l">Arrived</span></div>
    <div class="stat"><span class="v" id="s-stop">0</span><span class="l">Stopped</span></div>
    <div class="stat"><span class="v" id="s-avg">0.0</span><span class="l">Avg Travel</span></div>
    <div class="stat"><span class="v" id="s-zoom">100%</span><span class="l">Zoom</span></div>
  </div>
  <div class="controls">
    <button id="btn-slow">0.5x</button>
    <button id="btn-norm" class="active">1x</button>
    <button id="btn-fast">3x</button>
    <button id="btn-zout">-</button>
    <button id="btn-zreset">Reset View</button>
    <button id="btn-zin">+</button>
    <button id="btn-pause">Pause</button>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="c"></canvas>
  <div id="gen-progress">
    <div class="title">Generating City...</div>
    <div id="gen-phase">Starting</div>
    <div class="bar"><div id="gen-fill" class="fill"></div></div>
    <div id="gen-meta" class="meta"></div>
  </div>
  <div id="tune-panel">
    <div class="title">Generation Tuning</div>
    <div class="tune-group">
      <h3>Highways</h3>
      <div class="tune-row"><label for="t-highway-seeds">Seed Count</label><span class="val" id="v-highway-seeds"></span><input id="t-highway-seeds" type="range" min="2" max="10" step="1"></div>
      <div class="tune-row"><label for="t-highway-minlen">Min Length Ratio</label><span class="val" id="v-highway-minlen"></span><input id="t-highway-minlen" type="range" min="0.2" max="0.8" step="0.01"></div>
      <div class="tune-row"><label for="t-highway-maxlen">Max Length Mult</label><span class="val" id="v-highway-maxlen"></span><input id="t-highway-maxlen" type="range" min="1.0" max="2.6" step="0.05"></div>
    </div>
    <div class="tune-group">
      <h3>Main Roads</h3>
      <div class="tune-row"><label for="t-main-max">Branch Cap</label><span class="val" id="v-main-max"></span><input id="t-main-max" type="range" min="80" max="420" step="5"></div>
      <div class="tune-row"><label for="t-main-factor">Trunk Factor</label><span class="val" id="v-main-factor"></span><input id="t-main-factor" type="range" min="0.2" max="1.2" step="0.01"></div>
      <div class="tune-row"><label for="t-main-skip">Skip Chance</label><span class="val" id="v-main-skip"></span><input id="t-main-skip" type="range" min="0.02" max="0.4" step="0.01"></div>
    </div>
    <div class="tune-group">
      <h3>Local Roads</h3>
      <div class="tune-row"><label for="t-local-base">Base Cap</label><span class="val" id="v-local-base"></span><input id="t-local-base" type="range" min="600" max="2800" step="20"></div>
      <div class="tune-row"><label for="t-local-area">Area Factor</label><span class="val" id="v-local-area"></span><input id="t-local-area" type="range" min="0.01" max="0.12" step="0.005"></div>
      <div class="tune-row"><label for="t-local-main">Main Influence</label><span class="val" id="v-local-main"></span><input id="t-local-main" type="range" min="0.8" max="3.0" step="0.05"></div>
      <div class="tune-row"><label for="t-local-branch">Branch Extra</label><span class="val" id="v-local-branch"></span><input id="t-local-branch" type="range" min="0" max="2.2" step="0.05"></div>
      <div class="tune-row"><label for="t-local-loop">Loop Chance</label><span class="val" id="v-local-loop"></span><input id="t-local-loop" type="range" min="0" max="0.5" step="0.01"></div>
    </div>
    <div class="tune-group">
      <h3>Housing + Cleanup</h3>
      <div class="tune-row"><label for="t-house-mult">Housing Mult</label><span class="val" id="v-house-mult"></span><input id="t-house-mult" type="range" min="1" max="8" step="1"></div>
      <div class="tune-row"><label for="t-local-frontage">Local Frontage Bias</label><span class="val" id="v-local-frontage"></span><input id="t-local-frontage" type="range" min="0.2" max="0.9" step="0.01"></div>
      <div class="tune-row"><label for="t-near-local">Nearby Local Bias Cap</label><span class="val" id="v-near-local"></span><input id="t-near-local" type="range" min="0.1" max="0.6" step="0.01"></div>
      <div class="tune-row"><label for="t-main-frontage-cap">Main Frontage Cap</label><span class="val" id="v-main-frontage-cap"></span><input id="t-main-frontage-cap" type="range" min="0.04" max="0.3" step="0.01"></div>
      <div class="tune-row"><label for="t-infill">Infill Chance</label><span class="val" id="v-infill"></span><input id="t-infill" type="range" min="0.1" max="0.95" step="0.01"></div>
      <div class="tune-row"><label for="t-edge-local">Edge Prune Local</label><span class="val" id="v-edge-local"></span><input id="t-edge-local" type="range" min="0" max="1" step="0.01"></div>
      <div class="tune-row"><label for="t-edge-main">Edge Prune Main</label><span class="val" id="v-edge-main"></span><input id="t-edge-main" type="range" min="0" max="1" step="0.01"></div>
    </div>
    <div class="tune-actions">
      <button id="btn-apply-regenerate">Apply + Regenerate</button>
    </div>
  </div>
  <div id="legend">
    <div class="leg"><span class="swatch" style="background:#3f485d"></span>Local road</div>
    <div class="leg"><span class="swatch" style="background:#2f638f"></span>Main street</div>
    <div class="leg"><span class="swatch" style="background:#216e7f"></span>Highway (4 lanes)</div>
    <div class="leg"><span class="swatch" style="background:#2f3344"></span>Intersection</div>
  </div>
  <div id="zoom-tip">Wheel: zoom | Drag: pan</div>
</div>

<script>
const EMPTY = 0;
const LOCAL = 1;
const MAIN = 2;
const HIGHWAY = 3;
const INTER = 4;

const GRID_W = 192;
const GRID_H = 138;
const CELL = 24;

const TUNE_DEFAULTS = {
  highwaySeeds: 5,
  highwayMinLenRatio: 0.45,
  highwayMaxLenMult: 1.8,
  mainBranchCap: 180,
  mainFromHighwayFactor: 0.5,
  mainSkipChance: 0.2,
  localBaseCap: 1200,
  localAreaFactor: 0.05,
  localFromMainFactor: 1.6,
  localBranchExtra: 0.8,
  localLoopChance: 0.16,
  edgePruneLocal: 0.75,
  edgePruneMain: 0.55,
  houseSpawnMult: 3,
  localFrontageBias: 0.52,
  nearLocalBiasCap: 0.28,
  mainFrontageCap: 0.12,
  infillChance: 0.52,
};

const tuning = { ...TUNE_DEFAULTS };

const ROAD_RANK = { [LOCAL]: 1, [MAIN]: 2, [HIGHWAY]: 3 };
const CLASS_BIT = { [LOCAL]: 1, [MAIN]: 2, [HIGHWAY]: 4 };
const ROAD_COLOR = { [LOCAL]: '#3f485d', [MAIN]: '#2f638f', [HIGHWAY]: '#1e7f90' };

const C = {
  bg: '#131722',
  fringe: '#0e121b',
  fringe2: '#101725',
  block: '#1d2231',
  blockAlt: '#192031',
  lot: '#243048',
  lotAlt: '#283552',
  roofA: '#5f6d8a',
  roofB: '#6c7c9b',
  inter: '#2f3344',
  lane: 'rgba(214,222,240,0.18)',
  laneSoft: 'rgba(214,222,240,0.11)',
  hwyEdge: 'rgba(190,230,240,0.22)',
  hwyMedian: 'rgba(12,28,35,0.56)',
  carStop: '#e76464',
  carShadow: 'rgba(0,0,0,0.45)',
  headlight: 'rgba(255,245,170,0.55)',
  park: '#2d5a3d',
  parkLight: '#3d7a4d',
  parkTree: '#1f3d26',
};

let grid = [];
let dirGrid = [];
let interMask = [];
let cityMask = [];
let buildingCache = [];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const view = {
  zoom: 1,
  minZoom: 0.08,
  maxZoom: 2.8,
  panX: 0,
  panY: 0,
  dragging: false,
  dragStartX: 0,
  dragStartY: 0,
};

const WORLD_W = GRID_W * CELL;
const WORLD_H = GRID_H * CELL;

function create2D(h, w, fillVal) {
  return new Array(h).fill(null).map(() => new Array(w).fill(fillVal));
}

function resetArrays() {
  grid = create2D(GRID_H, GRID_W, EMPTY);
  dirGrid = create2D(GRID_H, GRID_W, null);
  interMask = create2D(GRID_H, GRID_W, 0);
  cityMask = create2D(GRID_H, GRID_W, false);
}

function inBounds(x, y) {
  return Number.isInteger(x) && Number.isInteger(y) && x >= 0 && y >= 0 && x < GRID_W && y < GRID_H;
}

function inCity(x, y) {
  return inBounds(x, y) && cityMask[y] != null && cityMask[y][x] === true;
}

function isDrivable(x, y) {
  return inCity(x, y) && grid[y][x] !== EMPTY;
}

function setRoad(x, y, roadType, dir) {
  if (!inCity(x, y)) return;
  const cur = grid[y][x];
  const curDir = dirGrid[y][x];

  if (cur === EMPTY) {
    grid[y][x] = roadType;
    dirGrid[y][x] = dir;
    return;
  }

  if (cur === INTER) {
    interMask[y][x] |= CLASS_BIT[roadType] || 0;
    return;
  }

  if (curDir === dir) {
    grid[y][x] = ROAD_RANK[roadType] > ROAD_RANK[cur] ? roadType : cur;
    return;
  }

  grid[y][x] = INTER;
  dirGrid[y][x] = 'b';
  interMask[y][x] = (CLASS_BIT[cur] || 0) | (CLASS_BIT[roadType] || 0);
}

async function buildCity(onProgress = null) {
  resetArrays();

  const clampI = (v, lo, hi) => Math.floor(Math.max(lo, Math.min(hi, v)));

  function buildCityMask() {
    const cx = GRID_W * 0.52;
    const cy = GRID_H * 0.53;
    const rx = GRID_W * 0.50;
    const ry = GRID_H * 0.46;

    for (let y = 0; y < GRID_H; y++) {
      for (let x = 0; x < GRID_W; x++) {
        const nx = (x - cx) / rx;
        const ny = (y - cy) / ry;
        const ang = Math.atan2(ny, nx);
        const wobble =
          0.12 * Math.sin(ang * 3.0 + 0.8) +
          0.08 * Math.sin(ang * 5.0 - 1.4) +
          0.05 * Math.sin((x + y) * 0.12);
        const d = Math.pow(Math.abs(nx), 2.2) + Math.pow(Math.abs(ny), 2.2);
        cityMask[y][x] = d <= (1.0 + wobble);
      }
    }
  }

  function roadClassAt(x, y) {
    const t = grid[y][x];
    if (t === HIGHWAY || t === MAIN || t === LOCAL) return t;
    if (t === INTER) {
      const mask = interMask[y][x] || 0;
      if (mask & CLASS_BIT[HIGHWAY]) return HIGHWAY;
      if (mask & CLASS_BIT[MAIN]) return MAIN;
      return LOCAL;
    }
    return null;
  }

  function inRoadBounds(x, y) {
    return inBounds(x, y) && inCity(x, y);
  }

  function tooCloseToRoad(x, y, spacing, prevX, prevY, allowClasses = null) {
    for (let oy = -spacing; oy <= spacing; oy++) {
      for (let ox = -spacing; ox <= spacing; ox++) {
        if (ox === 0 && oy === 0) continue;
        const nx = x + ox;
        const ny = y + oy;
        if (!inBounds(nx, ny)) continue;
        if (nx === prevX && ny === prevY) continue;
        if (grid[ny][nx] === EMPTY) continue;
        if (allowClasses) {
          const cls = roadClassAt(nx, ny);
          if (allowClasses.has(cls)) continue;
        }
        return true;
      }
    }
    return false;
  }

  function localTouchesHighway(x, y) {
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for (const d of dirs) {
      const nx = x + d[0];
      const ny = y + d[1];
      if (!inBounds(nx, ny)) continue;
      if (roadClassAt(nx, ny) === HIGHWAY) return true;
    }
    return false;
  }

  function classDensityScore(x, y, klass) {
    let n = 0;
    for (let oy = -1; oy <= 1; oy++) {
      for (let ox = -1; ox <= 1; ox++) {
        if (ox === 0 && oy === 0) continue;
        const nx = x + ox;
        const ny = y + oy;
        if (!inBounds(nx, ny) || !inCity(nx, ny)) continue;
        const cls = roadClassAt(nx, ny);
        if (cls === klass) n++;
      }
    }
    return n;
  }

  function violatesParallelRule(x, y, dir, klass) {
    if (dir === 'h') {
      const upper = (inBounds(x, y - 1) && roadClassAt(x, y - 1) === klass) ||
                    (inBounds(x - 1, y - 1) && roadClassAt(x - 1, y - 1) === klass) ||
                    (inBounds(x + 1, y - 1) && roadClassAt(x + 1, y - 1) === klass);
      const lower = (inBounds(x, y + 1) && roadClassAt(x, y + 1) === klass) ||
                    (inBounds(x - 1, y + 1) && roadClassAt(x - 1, y + 1) === klass) ||
                    (inBounds(x + 1, y + 1) && roadClassAt(x + 1, y + 1) === klass);
      return upper && lower;
    }

    const left = (inBounds(x - 1, y) && roadClassAt(x - 1, y) === klass) ||
                 (inBounds(x - 1, y - 1) && roadClassAt(x - 1, y - 1) === klass) ||
                 (inBounds(x - 1, y + 1) && roadClassAt(x - 1, y + 1) === klass);
    const right = (inBounds(x + 1, y) && roadClassAt(x + 1, y) === klass) ||
                  (inBounds(x + 1, y - 1) && roadClassAt(x + 1, y - 1) === klass) ||
                  (inBounds(x + 1, y + 1) && roadClassAt(x + 1, y + 1) === klass);
    return left && right;
  }

  function perpendicular(dx, dy) {
    if (dx !== 0) return { dx: 0, dy: Math.random() < 0.5 ? -1 : 1 };
    return { dx: Math.random() < 0.5 ? -1 : 1, dy: 0 };
  }

  function randomEdgeSeed() {
    const e = Math.random() * 4 | 0;
    const pad = 4;
    if (e === 0) return { x: clampI(pad + Math.random() * (GRID_W - pad * 2 - 1), pad, GRID_W - pad - 1), y: 0, dx: 0, dy: 1 };
    if (e === 1) return { x: GRID_W - 1, y: clampI(pad + Math.random() * (GRID_H - pad * 2 - 1), pad, GRID_H - pad - 1), dx: -1, dy: 0 };
    if (e === 2) return { x: clampI(pad + Math.random() * (GRID_W - pad * 2 - 1), pad, GRID_W - pad - 1), y: GRID_H - 1, dx: 0, dy: -1 };
    return { x: 0, y: clampI(pad + Math.random() * (GRID_H - pad * 2 - 1), pad, GRID_H - pad - 1), dx: 1, dy: 0 };
  }

  function adjacentCountByClass(x, y, klass) {
    let n = 0;
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for (const d of dirs) {
      const nx = x + d[0];
      const ny = y + d[1];
      if (!inBounds(nx, ny) || !inCity(nx, ny)) continue;
      if (roadClassAt(nx, ny) === klass) n++;
    }
    return n;
  }

  function downgradeUnhelpfulHighways() {
    const seen = create2D(GRID_H, GRID_W, false);
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];

    // 1) Downgrade entire highway components that do not connect well to the city.
    for (let y = 0; y < GRID_H; y++) {
      for (let x = 0; x < GRID_W; x++) {
        if (seen[y][x] || grid[y][x] !== HIGHWAY) continue;

        const q = [{x, y}];
        seen[y][x] = true;
        const comp = [];
        let mainTouches = 0;

        while (q.length) {
          const cur = q.pop();
          comp.push(cur);
          mainTouches += adjacentCountByClass(cur.x, cur.y, MAIN);

          for (const d of dirs) {
            const nx = cur.x + d[0];
            const ny = cur.y + d[1];
            if (!inBounds(nx, ny) || !inCity(nx, ny)) continue;
            if (seen[ny][nx] || grid[ny][nx] !== HIGHWAY) continue;
            seen[ny][nx] = true;
            q.push({x: nx, y: ny});
          }
        }

        if (comp.length < 30 || mainTouches < 2) {
          for (const c of comp) {
            grid[c.y][c.x] = MAIN;
            if (dirGrid[c.y][c.x] === 'b') dirGrid[c.y][c.x] = 'h';
            if (interMask[c.y][c.x] & CLASS_BIT[HIGHWAY]) {
              interMask[c.y][c.x] &= ~CLASS_BIT[HIGHWAY];
            }
          }
        }
      }
    }

    // 2) Trim highway dead tails that have no main-road purpose.
    let changed = true;
    let passes = 0;
    while (changed && passes < 6) {
      changed = false;
      passes++;
      for (let y = 1; y < GRID_H - 1; y++) {
        for (let x = 1; x < GRID_W - 1; x++) {
          if (grid[y][x] !== HIGHWAY) continue;
          const hN = adjacentCountByClass(x, y, HIGHWAY);
          const mN = adjacentCountByClass(x, y, MAIN);
          if (mN === 0 && hN <= 1) {
            grid[y][x] = MAIN;
            if (dirGrid[y][x] === 'b') dirGrid[y][x] = 'h';
            changed = true;
          }
        }
      }
    }
  }

  function stepGrow(seed, roadType, cfg) {
    const path = [];
    let x = seed.x;
    let y = seed.y;
    let dx = seed.dx;
    let dy = seed.dy;

    const canUse = (tx, ty) => roadType === LOCAL ? inRoadBounds(tx, ty) : inBounds(tx, ty);

    if (!canUse(x, y) || grid[y][x] !== EMPTY) return path;
    if (roadType === LOCAL && localTouchesHighway(x, y)) return path;

    cityMask[y][x] = true;
    setRoad(x, y, roadType, dx !== 0 ? 'h' : 'v');
    path.push({ x, y, dx, dy });

    for (let i = 0; i < cfg.maxLen; i++) {
      if (Math.random() < cfg.stopChance) break;

      let ndx = dx;
      let ndy = dy;
      const r = Math.random();
      if (r > cfg.straightChance) {
        const p = perpendicular(dx, dy);
        ndx = p.dx;
        ndy = p.dy;
      }

      const nx = x + ndx;
      const ny = y + ndy;
      if (!canUse(nx, ny)) break;

      const cls = roadClassAt(nx, ny);
      if (grid[ny][nx] !== EMPTY) {
        if (roadType === HIGHWAY && cls === HIGHWAY) break;
        if (roadType === MAIN && cls === HIGHWAY) break;
        if (roadType === LOCAL && (cls === HIGHWAY || cls === MAIN)) break;
        if (roadType === LOCAL && cls === LOCAL && Math.random() < cfg.loopChance) {
          // Allow occasional local-local joins to form neighborhood loops.
          setRoad(nx, ny, LOCAL, ndx !== 0 ? 'h' : 'v');
          path.push({ x: nx, y: ny, dx: ndx, dy: ndy });
        }
        break;
      }

      const allowNear = new Set();
      if (roadType === MAIN) allowNear.add(HIGHWAY);
      if (roadType === LOCAL) {
        allowNear.add(MAIN);
      }
      if (tooCloseToRoad(nx, ny, cfg.spacing, x, y, allowNear)) break;
      if (roadType === LOCAL && localTouchesHighway(nx, ny)) break;
      if (roadType === MAIN) {
        if (violatesParallelRule(nx, ny, ndx !== 0 ? 'h' : 'v', MAIN)) break;
        if (classDensityScore(nx, ny, MAIN) >= 5) break;
      }
      if (roadType === LOCAL) {
        if (violatesParallelRule(nx, ny, ndx !== 0 ? 'h' : 'v', LOCAL)) break;
        if (classDensityScore(nx, ny, LOCAL) >= 6) break;
      }

      cityMask[ny][nx] = true;
      setRoad(nx, ny, roadType, ndx !== 0 ? 'h' : 'v');
      path.push({ x: nx, y: ny, dx: ndx, dy: ndy });
      x = nx;
      y = ny;
      dx = ndx;
      dy = ndy;

      if (x === 0 || y === 0 || x === GRID_W - 1 || y === GRID_H - 1) break;
    }

    return path;
  }

  buildCityMask();
  if (onProgress) onProgress(10, 'Mask', 'Boundary mask built');
  await new Promise(requestAnimationFrame);

  const highways = [];
  const mainTiles = [];
  const localTiles = [];
  const mapArea = GRID_W * GRID_H;
  const mapScale = Math.sqrt(mapArea / (64 * 46));

  // 1) Highways from edge seeds, grown step-by-step.
  const highwaySeedCount = clampI(tuning.highwaySeeds, 2, 10);
  const minHighwayLen = Math.floor(Math.max(GRID_W, GRID_H) * tuning.highwayMinLenRatio);
  const highwayCfg = {
    straightChance: 0.95,
    stopChance: 0.00,
    maxLen: Math.floor(Math.max(GRID_W, GRID_H) * tuning.highwayMaxLenMult),
    spacing: 0,
    loopChance: 0.0,
  };

  for (let i = 0; i < highwaySeedCount; i++) {
    let best = [];
    for (let tries = 0; tries < 18; tries++) {
      const raw = randomEdgeSeed();
      const seed = {
        x: clampI(raw.x + raw.dx * 2, 1, GRID_W - 2),
        y: clampI(raw.y + raw.dy * 2, 1, GRID_H - 2),
        dx: raw.dx,
        dy: raw.dy,
      };
      const path = stepGrow(seed, HIGHWAY, highwayCfg);
      if (path.length > best.length) best = path;
      if (best.length >= minHighwayLen) break;
    }
    if (best.length >= 20) highways.push(best);
    if (onProgress) onProgress(15 + Math.floor((i + 1) / highwaySeedCount * 25), 'Highways', `Seeds ${i + 1}/${highwaySeedCount}`);
  }

  function highwayAnchor(path) {
    if (!path || path.length === 0) return null;
    return path[path.length >> 1];
  }

  function stitchHighways(a, b) {
    if (!a || !b) return;
    let x = a.x;
    let y = a.y;
    let horizontalFirst = Math.abs(b.x - a.x) >= Math.abs(b.y - a.y);

    const push = (nx, ny, dir) => {
      if (!inBounds(nx, ny)) return false;
      cityMask[ny][nx] = true;
      setRoad(nx, ny, HIGHWAY, dir);
      return true;
    };

    push(x, y, horizontalFirst ? 'h' : 'v');

    while (x !== b.x || y !== b.y) {
      if (horizontalFirst && x !== b.x) {
        x += Math.sign(b.x - x);
        push(x, y, 'h');
      } else if (!horizontalFirst && y !== b.y) {
        y += Math.sign(b.y - y);
        push(x, y, 'v');
      } else {
        horizontalFirst = !horizontalFirst;
      }

      // Slight jogs keep connectors from feeling too geometric.
      if (Math.random() < 0.03) {
        if (horizontalFirst && y !== b.y) {
          y += Math.sign(b.y - y);
          push(x, y, 'v');
        } else if (!horizontalFirst && x !== b.x) {
          x += Math.sign(b.x - x);
          push(x, y, 'h');
        }
      }
    }
  }

  // Connect isolated highways into one connected backbone.
  if (highways.length > 1) {
    for (let i = 1; i < highways.length; i++) {
      const a = highwayAnchor(highways[i - 1]);
      const b = highwayAnchor(highways[i]);
      stitchHighways(a, b);
    }
  }

  if (onProgress) onProgress(42, 'Highways', `Connected trunks: ${highways.length}`);
  await new Promise(requestAnimationFrame);

  // 2) Main roads from highway points, grown step-by-step.
  const mainCfg = {
    straightChance: 0.70,
    stopChance: 0.00,
    maxLen: 24 + (Math.random() * 24 | 0),
    spacing: 0,
    loopChance: 0.0,
  };
  const maxMainRoads = Math.floor(tuning.mainBranchCap);
  const targetMainRoads = Math.max(maxMainRoads, Math.floor(highways.reduce((s, h) => s + h.length, 0) * tuning.mainFromHighwayFactor));
  let mainCount = 0;

  for (const h of highways) {
    let idx = 6;
    while (idx < h.length - 6 && mainCount < targetMainRoads) {
      idx += 4 + (Math.random() * 6 | 0);
      if (idx >= h.length - 2) break;
      if (Math.random() < Math.max(0.06, tuning.mainSkipChance - mapScale * 0.03)) continue;

      const p = h[idx];
      const d = perpendicular(p.dx, p.dy);
      const seed = { x: p.x + d.dx, y: p.y + d.dy, dx: d.dx, dy: d.dy };
      if (!inRoadBounds(seed.x, seed.y) || grid[seed.y][seed.x] !== EMPTY) continue;
      const path = stepGrow(seed, MAIN, mainCfg);
      if (path.length >= 8) {
        mainCount++;
        for (const t of path) mainTiles.push(t);
      }
    }
  }

  downgradeUnhelpfulHighways();
  if (onProgress) onProgress(60, 'Main Roads', `Main branches: ${mainCount}`);
  await new Promise(requestAnimationFrame);

  // 3) Local roads from main roads, short and high-randomness growth.
  const localCfg = {
    straightChance: 0.40,
    stopChance: 0.20,
    maxLen: 7 + (Math.random() * 12 | 0),
    spacing: 1,
    loopChance: 0.30,
  };
  const maxLocalRoads = Math.max(Math.floor(tuning.localBaseCap), Math.floor(mapArea * tuning.localAreaFactor + mainTiles.length * tuning.localFromMainFactor));
  let localCount = 0;

  for (let i = 0; i < mainTiles.length && localCount < maxLocalRoads; i += 1 + (Math.random() * 2 | 0)) {
    if (Math.random() < Math.max(0.07, 0.35 - mapScale * 0.09)) continue;
    const m = mainTiles[i];
    const d = perpendicular(m.dx, m.dy);
    const seed = { x: m.x + d.dx, y: m.y + d.dy, dx: d.dx, dy: d.dy };
    if (!inRoadBounds(seed.x, seed.y) || grid[seed.y][seed.x] !== EMPTY) continue;
    const path = stepGrow(seed, LOCAL, localCfg);
    if (path.length >= 2) {
      localCount++;
      for (const t of path) localTiles.push(t);
    }
  }

  // Secondary local growth: branch from existing local roads so neighborhoods
  // connect internally instead of only hanging off main roads.
  const localBranchCfg = {
    straightChance: 0.52,
    stopChance: 0.12,
    maxLen: 6 + (Math.random() * 10 | 0),
    spacing: 1,
    loopChance: 0.55,
  };
  const localBranchCap = maxLocalRoads + Math.floor(maxLocalRoads * tuning.localBranchExtra);
  for (let i = 0; i < localTiles.length && localCount < localBranchCap; i += 1 + (Math.random() * 3 | 0)) {
    if (Math.random() < Math.max(0.18, 0.42 - mapScale * 0.07)) continue;
    const l = localTiles[i];
    const d = perpendicular(l.dx, l.dy);
    const seed = { x: l.x + d.dx, y: l.y + d.dy, dx: d.dx, dy: d.dy };
    if (!inRoadBounds(seed.x, seed.y) || grid[seed.y][seed.x] !== EMPTY) continue;
    const path = stepGrow(seed, LOCAL, localBranchCfg);
    if (path.length >= 2) {
      localCount++;
      for (const t of path) localTiles.push(t);
    }
  }
  if (onProgress) onProgress(82, 'Local Roads', `Local branches: ${localCount}`);
  await new Promise(requestAnimationFrame);

  // Occasional short local loops.
  for (let i = 0; i < localTiles.length; i += 6) {
    if (Math.random() >= tuning.localLoopChance) continue;
    const a = localTiles[i];
    const candidates = [[2,0],[-2,0],[0,2],[0,-2]];
    for (const c of candidates) {
      const tx = a.x + c[0];
      const ty = a.y + c[1];
      if (!inRoadBounds(tx, ty) || roadClassAt(tx, ty) !== LOCAL) continue;
      const mx = a.x + Math.sign(c[0]);
      const my = a.y + Math.sign(c[1]);
      if (!inRoadBounds(mx, my) || grid[my][mx] !== EMPTY) continue;
      if (localTouchesHighway(mx, my)) continue;
      if (tooCloseToRoad(mx, my, 1, a.x, a.y, new Set([MAIN]))) continue;
      if (violatesParallelRule(mx, my, mx !== a.x ? 'h' : 'v', LOCAL)) continue;
      setRoad(mx, my, LOCAL, mx !== a.x ? 'h' : 'v');
      break;
    }
  }
  if (onProgress) onProgress(88, 'Local Loops', `Loop candidates: ${localTiles.length}`);

  function orientFromPair(a, b) {
    const sameX = a.x === b.x;
    const sameY = a.y === b.y;
    if (sameY) return 'h';
    if (sameX) return 'v';
    return null;
  }

  function roadNeighbors(x, y) {
    const out = [];
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for (const d of dirs) {
      const nx = x + d[0];
      const ny = y + d[1];
      if (!inCity(nx, ny)) continue;
      if (grid[ny][nx] === EMPTY) continue;
      out.push({x: nx, y: ny});
    }
    return out;
  }

  function pruneEdgeRoads() {
    const edgeX = Math.max(3, Math.floor(GRID_W * 0.08));
    const edgeY = Math.max(3, Math.floor(GRID_H * 0.08));

    for (let y = 0; y < GRID_H; y++) {
      for (let x = 0; x < GRID_W; x++) {
        const t = grid[y][x];
        if (t === EMPTY || t === HIGHWAY) continue;
        const nearX = Math.min(x, GRID_W - 1 - x);
        const nearY = Math.min(y, GRID_H - 1 - y);
        const edgeFactor = Math.min(nearX / edgeX, nearY / edgeY);
        if (edgeFactor >= 1) continue;

        const cls = roadClassAt(x, y) || t;
        const base = cls === LOCAL ? tuning.edgePruneLocal : tuning.edgePruneMain;
        const dropChance = base * (1 - edgeFactor);
        if (Math.random() < dropChance) {
          grid[y][x] = EMPTY;
          dirGrid[y][x] = null;
          interMask[y][x] = 0;
        }
      }
    }
  }

  function keepMajorityNetwork() {
    const seen = create2D(GRID_H, GRID_W, false);
    const comps = [];

    for (let y = 0; y < GRID_H; y++) {
      for (let x = 0; x < GRID_W; x++) {
        if (seen[y][x] || grid[y][x] === EMPTY || !inCity(x, y)) continue;
        const q = [{x, y}];
        const comp = [];
        seen[y][x] = true;
        while (q.length) {
          const cur = q.pop();
          comp.push(cur);
          for (const n of roadNeighbors(cur.x, cur.y)) {
            if (seen[n.y][n.x]) continue;
            seen[n.y][n.x] = true;
            q.push(n);
          }
        }
        comps.push(comp);
      }
    }

    if (comps.length <= 1) return;
    comps.sort((a, b) => b.length - a.length);
    const keep = new Set(comps[0].map(c => c.x + ',' + c.y));

    for (let i = 1; i < comps.length; i++) {
      for (const c of comps[i]) {
        if (keep.has(c.x + ',' + c.y)) continue;
        grid[c.y][c.x] = EMPTY;
        dirGrid[c.y][c.x] = null;
        interMask[c.y][c.x] = 0;
      }
    }

    // Trim hanging single-tile stubs left after component pruning.
    let changed = true;
    let pass = 0;
    while (changed && pass < 4) {
      changed = false;
      pass++;
      for (let y = 1; y < GRID_H - 1; y++) {
        for (let x = 1; x < GRID_W - 1; x++) {
          if (grid[y][x] === EMPTY) continue;
          if (roadClassAt(x, y) === HIGHWAY) continue;
          if (roadNeighbors(x, y).length <= 1) {
            grid[y][x] = EMPTY;
            dirGrid[y][x] = null;
            interMask[y][x] = 0;
            changed = true;
          }
        }
      }
    }
  }

  // Smart intersection cleanup: keep true junctions, downgrade fake/degenerate ones.
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (grid[y][x] !== INTER) continue;

      const nbrs = [];
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      for (const d of dirs) {
        const nx = x + d[0];
        const ny = y + d[1];
        if (!inCity(nx, ny)) continue;
        if (grid[ny][nx] === EMPTY) continue;
        nbrs.push({ x: nx, y: ny, t: grid[ny][nx], cls: roadClassAt(nx, ny) });
      }

      if (nbrs.length <= 1) {
        if (nbrs.length === 0) {
          grid[y][x] = EMPTY;
          dirGrid[y][x] = null;
          interMask[y][x] = 0;
          continue;
        }
        grid[y][x] = nbrs[0].cls || LOCAL;
        dirGrid[y][x] = (nbrs[0].x === x) ? 'v' : 'h';
        interMask[y][x] = 0;
        continue;
      }

      if (nbrs.length === 2) {
        const dir = orientFromPair(nbrs[0], nbrs[1]);
        if (dir !== null) {
          const cls = Math.max(nbrs[0].cls || LOCAL, nbrs[1].cls || LOCAL);
          grid[y][x] = cls;
          dirGrid[y][x] = dir;
          interMask[y][x] = 0;
          continue;
        }
      }

      // True junction (3+ connections, or 2-way corner) stays intersection.
      let mask = 0;
      for (const n of nbrs) {
        if (n.cls != null) mask |= CLASS_BIT[n.cls];
      }
      interMask[y][x] = mask || (CLASS_BIT[LOCAL] | CLASS_BIT[MAIN]);
      dirGrid[y][x] = 'b';
    }
  }

  // Edge sparseness + majority-network enforcement.
  pruneEdgeRoads();
  keepMajorityNetwork();

  // Re-normalize intersections after pruning passes.
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (grid[y][x] !== INTER) continue;
      const nbrs = roadNeighbors(x, y);
      if (nbrs.length <= 1) {
        if (nbrs.length === 0) {
          grid[y][x] = EMPTY;
          dirGrid[y][x] = null;
          interMask[y][x] = 0;
        } else {
          const cls = roadClassAt(nbrs[0].x, nbrs[0].y) || LOCAL;
          grid[y][x] = cls;
          dirGrid[y][x] = (nbrs[0].x === x) ? 'v' : 'h';
          interMask[y][x] = 0;
        }
      }
    }
  }

  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (grid[y][x] === INTER && interMask[y][x] === 0) {
        interMask[y][x] = CLASS_BIT[LOCAL] | CLASS_BIT[MAIN];
      }
    }
  }
  if (onProgress) onProgress(100, 'Done', `Highways: ${highways.length}\nMain: ${mainCount}\nLocal: ${localCount}`);
}

function tileClass(x, y) {
  const t = grid[y][x];
  if (t === LOCAL || t === MAIN || t === HIGHWAY) return t;
  return null;
}

function canConnectClass(aClass, bClass) {
  if (aClass == null || bClass == null) return false;
  if (aClass === HIGHWAY && bClass === LOCAL) return false;
  if (aClass === LOCAL && bClass === HIGHWAY) return false;
  return true;
}

function dirCompatible(dir, dx, dy) {
  if (dir === 'h') return dy === 0;
  if (dir === 'v') return dx === 0;
  return true;
}

function intersectionAccepts(ix, iy, roadClass) {
  if (grid[iy][ix] !== INTER) return true;
  return (interMask[iy][ix] & CLASS_BIT[roadClass]) !== 0;
}

function neighbours(x, y) {
  const dirs = [{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}];
  const out = [];
  const srcType = grid[y][x];
  const srcClass = srcType === INTER ? null : srcType;
  const srcDir = dirGrid[y][x];

  for (const d of dirs) {
    const nx = x + d.dx;
    const ny = y + d.dy;
    if (!isDrivable(nx, ny)) continue;

    const dstType = grid[ny][nx];
    const dstClass = dstType === INTER ? null : dstType;
    const dstDir = dirGrid[ny][nx];

    if (!dirCompatible(srcDir, d.dx, d.dy)) continue;
    if (!dirCompatible(dstDir, d.dx, d.dy)) continue;

    if (srcType !== INTER && dstType !== INTER) {
      if (!canConnectClass(srcClass, dstClass)) continue;
    }

    if (srcType === INTER && dstType !== INTER) {
      if (!intersectionAccepts(x, y, dstClass)) continue;
    }

    if (srcType !== INTER && dstType === INTER) {
      if (!intersectionAccepts(nx, ny, srcClass)) continue;
    }

    if (srcType === INTER && dstType === INTER) {
      const mask = interMask[y][x] & interMask[ny][nx];
      if (mask === 0) continue;
    }

    out.push({ x: nx, y: ny, dx: d.dx, dy: d.dy });
  }
  return out;
}

function moveCost(x, y) {
  const t = grid[y][x];
  if (t === HIGHWAY) return 1;
  if (t === MAIN) return 2;
  if (t === LOCAL) return 3;
  return 2;
}

function heuristic(ax, ay, bx, by) {
  return Math.abs(ax - bx) + Math.abs(ay - by);
}

function astar(sx, sy, gx, gy) {
  if (sx === gx && sy === gy) return [{x: sx, y: sy, dx: 0, dy: 0}];

  const key = (x, y) => y * GRID_W + x;
  const open = [{x: sx, y: sy, g: 0, f: heuristic(sx, sy, gx, gy), dx: 0, dy: 0}];
  const gScore = { [key(sx, sy)]: 0 };
  const from = {};

  while (open.length) {
    open.sort((a, b) => a.f - b.f);
    const cur = open.shift();
    if (cur.x === gx && cur.y === gy) {
      const path = [];
      let node = cur;
      while (node) {
        path.unshift(node);
        node = from[key(node.x, node.y)] || null;
      }
      return path;
    }

    for (const nb of neighbours(cur.x, cur.y)) {
      const ng = (gScore[key(cur.x, cur.y)] ?? Infinity) + moveCost(nb.x, nb.y);
      const nbKey = key(nb.x, nb.y);
      if (ng < (gScore[nbKey] ?? Infinity)) {
        gScore[nbKey] = ng;
        from[nbKey] = cur;
        open.push({ x: nb.x, y: nb.y, g: ng, f: ng + heuristic(nb.x, nb.y, gx, gy), dx: nb.dx, dy: nb.dy });
      }
    }
  }

  return null;
}

let carIdCounter = 0;

function laneOffsetForClass(roadClass) {
  if (roadClass === HIGHWAY) return [4, 9];
  if (roadClass === MAIN) return [5];
  return [4];
}

function lanePoint(gx, gy, dx, dy, laneIndex) {
  const cx = gx * CELL + CELL / 2;
  const cy = gy * CELL + CELL / 2;
  const t = grid[gy][gx];
  if (t === INTER || (dx === 0 && dy === 0)) return { x: cx, y: cy };

  const roadClass = t;
  const choices = laneOffsetForClass(roadClass);
  const lane = choices[Math.min(laneIndex, choices.length - 1)];

  if (dx !== 0) {
    return { x: cx, y: cy + (dx > 0 ? lane : -lane) };
  }
  return { x: cx + (dy > 0 ? lane : -lane), y: cy };
}

class Car {
  constructor(x, y, gx, gy, path) {
    this.id = carIdCounter++;
    this.x = x;
    this.y = y;
    this.gx = gx;
    this.gy = gy;
    this.path = path.slice(1);
    this.dx = 0;
    this.dy = 0;
    if (path.length > 1) {
      this.dx = path[1].dx;
      this.dy = path[1].dy;
    }
    const klass = tileClass(x, y) || MAIN;
    this.laneIndex = klass === HIGHWAY ? (Math.random() < 0.5 ? 0 : 1) : 0;
    const p = lanePoint(x, y, this.dx, this.dy, this.laneIndex);
    this.rx = p.x;
    this.ry = p.y;
    this.targetRx = p.x;
    this.targetRy = p.y;
    this.travelTime = 0;
    this.stopped = false;
    this.len = 9 + (Math.random() * 4 | 0);
    this.wid = 5;
    this.color = Math.random() < 0.2 ? '#7cb6f5' : (Math.random() < 0.2 ? '#95de7f' : '#f4c24f');
  }

  get arrived() {
    return this.x === this.gx && this.y === this.gy;
  }

  nextStep() {
    return this.path.length ? this.path[0] : null;
  }

  advance() {
    const nxt = this.path.shift();
    this.dx = nxt.dx;
    this.dy = nxt.dy;
    this.x = nxt.x;
    this.y = nxt.y;
    const klass = tileClass(this.x, this.y) || MAIN;
    if (klass !== HIGHWAY) this.laneIndex = 0;
    else if (Math.random() < 0.05) this.laneIndex = this.laneIndex === 0 ? 1 : 0;
    const p = lanePoint(this.x, this.y, this.dx, this.dy, this.laneIndex);
    this.targetRx = p.x;
    this.targetRy = p.y;
    this.travelTime++;
    this.stopped = false;
  }

  tickStopped() {
    this.stopped = true;
    this.travelTime++;
  }

  updateRender(dt) {
    const speed = this.stopped ? 7 : 11;
    this.rx += (this.targetRx - this.rx) * Math.min(1, dt * speed);
    this.ry += (this.targetRy - this.ry) * Math.min(1, dt * speed);
  }
}

const MAX_CARS = 140;
const SPAWN_RATE = 0.62;
let cars = [];
let completed = [];
let occupied = new Set();
let interLocks = new Set();
let tickCount = 0;
let stoppedCount = 0;

function oKey(x, y) {
  return x + ',' + y;
}

function drivableTiles() {
  const out = [];
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (isDrivable(x, y)) out.push({x, y});
    }
  }
  return out;
}

function simReset() {
  cars = [];
  completed = [];
  occupied = new Set();
  interLocks = new Set();
  tickCount = 0;
  stoppedCount = 0;
  carIdCounter = 0;
}

function spawnCar() {
  if (cars.length >= MAX_CARS) return;
  if (Math.random() > SPAWN_RATE) return;

  const tiles = drivableTiles();
  if (tiles.length < 2) return;

  let tries = 0;
  while (tries < 18) {
    const start = tiles[Math.random() * tiles.length | 0];
    const dest = tiles[Math.random() * tiles.length | 0];

    if (start.x === dest.x && start.y === dest.y) { tries++; continue; }
    if (occupied.has(oKey(start.x, start.y))) { tries++; continue; }

    const path = astar(start.x, start.y, dest.x, dest.y);
    if (!path || path.length < 2) { tries++; continue; }

    const car = new Car(start.x, start.y, dest.x, dest.y, path);
    cars.push(car);
    occupied.add(oKey(start.x, start.y));
    return;
  }
}

function simStep() {
  tickCount++;
  interLocks.clear();
  stoppedCount = 0;

  for (let i = cars.length - 1; i > 0; i--) {
    const j = Math.random() * (i + 1) | 0;
    const t = cars[i];
    cars[i] = cars[j];
    cars[j] = t;
  }

  for (const car of cars) {
    car.stopped = false;
    let nxt = car.nextStep();

    if (!nxt) {
      if (!car.arrived) {
        const p = astar(car.x, car.y, car.gx, car.gy);
        if (p && p.length > 1) {
          car.path = p.slice(1);
          nxt = car.nextStep();
        }
      }
    }

    if (!nxt) {
      car.tickStopped();
      stoppedCount++;
      continue;
    }

    const nKey = oKey(nxt.x, nxt.y);
    if (occupied.has(nKey)) {
      car.tickStopped();
      stoppedCount++;
      continue;
    }

    if (grid[nxt.y][nxt.x] === INTER) {
      if (interLocks.has(nKey)) {
        car.tickStopped();
        stoppedCount++;
        continue;
      }
      interLocks.add(nKey);
    }

    occupied.delete(oKey(car.x, car.y));
    car.advance();
    occupied.add(oKey(car.x, car.y));
  }

  cars = cars.filter(car => {
    if (car.arrived) {
      occupied.delete(oKey(car.x, car.y));
      completed.push(car);
      return false;
    }
    return true;
  });

  spawnCar();
}

function generateBuildings() {
  const builtMask = create2D(GRID_H, GRID_W, false);

  let localRoadCount = 0;
  let mainRoadCount = 0;
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      const t = grid[y][x];
      if (t === LOCAL) localRoadCount++;
      if (t === MAIN) mainRoadCount++;
      if (t === INTER) {
        const m = interMask[y][x] || 0;
        if (m & CLASS_BIT[LOCAL]) localRoadCount++;
        else if (m & CLASS_BIT[MAIN]) mainRoadCount++;
      }
    }
  }

  const localRoadWeight = localRoadCount / Math.max(1, (localRoadCount + mainRoadCount));

  function hasResidentialFrontage(x, y) {
    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (const d of dirs) {
      const nx = x + d[0];
      const ny = y + d[1];
      if (!inCity(nx, ny)) continue;
      const t = grid[ny][nx];
      if (t === LOCAL || t === MAIN) return true;
      if (t === INTER) {
        const mask = interMask[ny][nx] || 0;
        if ((mask & CLASS_BIT[LOCAL]) || (mask & CLASS_BIT[MAIN])) return true;
      }
    }
    return false;
  }

  function frontageType(x, y) {
    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    let hasLocal = false;
    let hasMain = false;
    for (const d of dirs) {
      const nx = x + d[0];
      const ny = y + d[1];
      if (!inCity(nx, ny)) continue;
      const t = grid[ny][nx];
      if (t === MAIN) hasMain = true;
      if (t === LOCAL) hasLocal = true;
      if (t === INTER) {
        const mask = interMask[ny][nx] || 0;
        if (mask & CLASS_BIT[MAIN]) hasMain = true;
        if (mask & CLASS_BIT[LOCAL]) hasLocal = true;
      }
    }
    if (hasLocal) return LOCAL;
    if (hasMain) return MAIN;
    return null;
  }

  function lotFillChance(x, y) {
    const cx = (GRID_W - 1) / 2;
    const cy = (GRID_H - 1) / 2;
    const dx = (x - cx) / (GRID_W / 2);
    const dy = (y - cy) / (GRID_H / 2);
    const dist = Math.min(1, Math.sqrt(dx * dx + dy * dy));
    const coreBias = 0.72 + (1 - dist) * 0.22;
    const frontage = frontageType(x, y);
    if (frontage == null) return 0;

    // Main-frontage parcels stay lighter; local-frontage neighborhoods stay denser.
    if (frontage === MAIN) {
      const mainBase = 0.03 + (1 - dist) * 0.06;
      return Math.min(tuning.mainFrontageCap, mainBase + (1 - localRoadWeight) * 0.03);
    }

    const frontageBias = frontage === LOCAL ? tuning.localFrontageBias + localRoadWeight * 0.18 : 0.0;

    let nearLocal = 0;
    for (let oy = -2; oy <= 2; oy++) {
      for (let ox = -2; ox <= 2; ox++) {
        if (ox === 0 && oy === 0) continue;
        const nx = x + ox;
        const ny = y + oy;
        if (!inCity(nx, ny)) continue;
        const t = grid[ny][nx];
        if (t === LOCAL) nearLocal++;
        if (t === INTER && (interMask[ny][nx] & CLASS_BIT[LOCAL])) nearLocal++;
      }
    }

    const livingZoneBias = Math.min(tuning.nearLocalBiasCap, nearLocal * 0.022);
    const baseChance = Math.min(0.995, coreBias + frontageBias);
    const boostedChance = 1 - Math.pow(1 - Math.min(0.995, baseChance + livingZoneBias), tuning.houseSpawnMult);
    return Math.min(0.999, boostedChance);
  }

  function makeBuildingAt(x, y) {
    const px = x * CELL;
    const py = y * CELL;
    const blocks = [];
    const count = 1 + (Math.random() * 2 | 0);
    for (let i = 0; i < count; i++) {
      const m = 4;
      const bw = 6 + (Math.random() * (CELL - 2 * m - 7) | 0);
      const bh = 6 + (Math.random() * (CELL - 2 * m - 7) | 0);
      const bx = m + (Math.random() * Math.max(1, CELL - 2 * m - bw) | 0);
      const by = m + (Math.random() * Math.max(1, CELL - 2 * m - bh) | 0);
      blocks.push({bx, by, bw, bh, dark: Math.random() < 0.5, round: 1 + (Math.random() * 3 | 0)});
    }
    buildingCache.push({px, py, blocks, toneDark: Math.random() < 0.5, pad: 2 + (Math.random() * 2 | 0)});
    builtMask[y][x] = true;
  }

  function nearBuiltLot(x, y, r = 2) {
    for (let oy = -r; oy <= r; oy++) {
      for (let ox = -r; ox <= r; ox++) {
        if (ox === 0 && oy === 0) continue;
        const nx = x + ox;
        const ny = y + oy;
        if (!inBounds(nx, ny)) continue;
        if (builtMask[ny][nx]) return true;
      }
    }
    return false;
  }

  function countBuiltNearby(x, y, r = 2) {
    let count = 0;
    for (let oy = -r; oy <= r; oy++) {
      for (let ox = -r; ox <= r; ox++) {
        if (ox === 0 && oy === 0) continue;
        const nx = x + ox;
        const ny = y + oy;
        if (!inBounds(nx, ny)) continue;
        if (builtMask[ny][nx]) count++;
      }
    }
    return count;
  }

  function canPlaceBuildingAt(x, y, w, h) {
    for (let oy = 0; oy < h; oy++) {
      for (let ox = 0; ox < w; ox++) {
        const nx = x + ox;
        const ny = y + oy;
        if (nx >= GRID_W || ny >= GRID_H) return false;
        if (!inCity(nx, ny)) return false;
        if (builtMask[ny][nx]) return false;
        if (grid[ny][nx] !== EMPTY) return false;
      }
    }
    return true;
  }

  function markBuildingFootprint(x, y, w, h) {
    for (let oy = 0; oy < h; oy++) {
      for (let ox = 0; ox < w; ox++) {
        builtMask[y + oy][x + ox] = true;
      }
    }
  }

  function makeTowerAt(x, y, w, h) {
    const px = x * CELL;
    const py = y * CELL;
    const blocks = [];
    const count = 2 + (Math.random() * 2 | 0);
    const cellW = w * CELL;
    const cellH = h * CELL;
    
    for (let i = 0; i < count; i++) {
      const m = 3;
      const bw = 5 + (Math.random() * Math.max(2, cellW - 2 * m - 5) | 0);
      const bh = 5 + (Math.random() * Math.max(2, cellH - 2 * m - 5) | 0);
      const bx = m + (Math.random() * Math.max(1, cellW - 2 * m - bw) | 0);
      const by = m + (Math.random() * Math.max(1, cellH - 2 * m - bh) | 0);
      blocks.push({bx, by, bw, bh, dark: Math.random() < 0.5, round: 0});
    }
    buildingCache.push({px, py, blocks, toneDark: Math.random() < 0.5, pad: 1, w, h, type: 'tower'});
    markBuildingFootprint(x, y, w, h);
  }

  function makeParkAt(x, y, w, h) {
    const px = x * CELL;
    const py = y * CELL;
    const cellW = w * CELL;
    const cellH = h * CELL;
    const trees = [];
    const treeCount = Math.ceil(cellW * cellH / (24 * 24));
    for (let i = 0; i < treeCount; i++) {
      trees.push({
        tx: Math.random() * cellW,
        ty: Math.random() * cellH,
        size: 1.5 + Math.random()
      });
    }
    buildingCache.push({px, py, w, h, type: 'park', trees, toneDark: Math.random() < 0.5});
    markBuildingFootprint(x, y, w, h);
  }

  buildingCache = [];
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (!inCity(x, y)) continue;
      if (grid[y][x] !== EMPTY) continue;
      if (!hasResidentialFrontage(x, y)) continue;
      if (builtMask[y][x]) continue;

      // Density is heavier near the city core and along main streets.
      // Edge lots and local-frontage parcels stay more open.
      if (Math.random() > lotFillChance(x, y)) continue;
      
      const density = countBuiltNearby(x, y, 2);
      
      // In very dense areas, try parks or towers
       if (density > 6) {
        // Try parks (2x2 to 6x6 variable sizes)
         if (Math.random() < 0.12) {
          const sizes = [[2,2], [2,3], [3,2], [3,3], [4,2], [2,4], [3,4], [4,3], [4,4], [5,3], [3,5], [5,5], [6,4], [4,6], [6,6]];
          const [pw, ph] = sizes[Math.random() * sizes.length | 0];
          if (canPlaceBuildingAt(x, y, pw, ph)) {
            makeParkAt(x, y, pw, ph);
            continue;
          }
        }
        // Try 2x2 towers
         if (Math.random() < 0.25 && canPlaceBuildingAt(x, y, 2, 2)) {
          makeTowerAt(x, y, 2, 2);
          continue;
        }
      }
      
       if (density > 3) {
        // Try 2x1 or 1x2 towers
         if (Math.random() < 0.18) {
          if (Math.random() < 0.5 && canPlaceBuildingAt(x, y, 2, 1)) {
            makeTowerAt(x, y, 2, 1);
            continue;
          } else if (canPlaceBuildingAt(x, y, 1, 2)) {
            makeTowerAt(x, y, 1, 2);
            continue;
          }
        }
      }
      
      makeBuildingAt(x, y);
    }
  }

  // Infill pass: reduce empty gaps inside active local neighborhoods.
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (builtMask[y][x]) continue;
      if (!inCity(x, y) || grid[y][x] !== EMPTY) continue;
      if (frontageType(x, y) !== LOCAL) continue;
      if (!nearBuiltLot(x, y, 2)) continue;
      if (Math.random() < tuning.infillChance) makeBuildingAt(x, y);
    }
  }
}

const ROAD_WIDTH = { [LOCAL]: 9, [MAIN]: 13, [HIGHWAY]: 19, [INTER]: 15 };

function centerOf(x, y) {
  return { x: x * CELL + CELL / 2, y: y * CELL + CELL / 2 };
}

function connectionClass(ax, ay, bx, by) {
  const a = grid[ay][ax];
  const b = grid[by][bx];
  if (a === INTER && b === INTER) return MAIN;
  if (a === INTER) return b;
  if (b === INTER) return a;
  return ROAD_RANK[a] >= ROAD_RANK[b] ? a : b;
}

function drawRoadLink(a, b, roadType, shadow = false) {
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = shadow ? 'rgba(0,0,0,0.28)' : ROAD_COLOR[roadType];
  ctx.lineWidth = ROAD_WIDTH[roadType] + (shadow ? 4 : 0);
  ctx.stroke();

  if (!shadow && roadType === HIGHWAY) {
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = ROAD_WIDTH[HIGHWAY] * 0.64;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }
}

function drawLaneDashes(a, b, roadType) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const len = Math.hypot(dx, dy);
  if (len < 2) return;

  const nx = -dy / len;
  const ny = dx / len;
  ctx.lineCap = 'round';

  if (roadType === HIGHWAY) {
    for (const off of [-6.5, 6.5]) {
      ctx.strokeStyle = C.hwyEdge;
      ctx.lineWidth = 1;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(a.x + nx * off, a.y + ny * off);
      ctx.lineTo(b.x + nx * off, b.y + ny * off);
      ctx.stroke();
    }

    for (const off of [-2.2, 2.2]) {
      ctx.strokeStyle = C.laneSoft;
      ctx.lineWidth = 1;
      ctx.setLineDash([5, 6]);
      ctx.beginPath();
      ctx.moveTo(a.x + nx * off, a.y + ny * off);
      ctx.lineTo(b.x + nx * off, b.y + ny * off);
      ctx.stroke();
    }

    ctx.strokeStyle = C.hwyMedian;
    ctx.lineWidth = 2;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    return;
  }

  ctx.strokeStyle = C.lane;
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 5]);
  for (const off of [0]) {
    ctx.beginPath();
    ctx.moveTo(a.x + nx * off, a.y + ny * off);
    ctx.lineTo(b.x + nx * off, b.y + ny * off);
    ctx.stroke();
  }
  ctx.setLineDash([]);
}

function drawRoadNetwork() {
  const links = [];
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (!isDrivable(x, y)) continue;
      if (isDrivable(x + 1, y)) {
        links.push({
          a: centerOf(x, y),
          b: centerOf(x + 1, y),
          t: connectionClass(x, y, x + 1, y),
        });
      }
      if (isDrivable(x, y + 1)) {
        links.push({
          a: centerOf(x, y),
          b: centerOf(x, y + 1),
          t: connectionClass(x, y, x, y + 1),
        });
      }
    }
  }

  links.sort((a, b) => ROAD_RANK[a.t] - ROAD_RANK[b.t]);
  for (const l of links) drawRoadLink(l.a, l.b, l.t, true);
  for (const l of links) drawRoadLink(l.a, l.b, l.t, false);
  for (const l of links) drawLaneDashes(l.a, l.b, l.t);

  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (grid[y][x] !== INTER) continue;
      const c = centerOf(x, y);
      ctx.fillStyle = C.inter;
      ctx.beginPath();
      ctx.arc(c.x, c.y, ROAD_WIDTH[INTER] * 0.62, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawCar(car) {
  const angle = Math.atan2(car.dy, car.dx);
  ctx.save();
  ctx.translate(car.rx, car.ry);
  ctx.rotate(angle);

  const l = car.len;
  const w = car.wid;

  ctx.fillStyle = C.carShadow;
  ctx.beginPath();
  ctx.ellipse(1.5, 1.5, l / 2 + 1, w / 2 + 1, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = car.stopped ? C.carStop : car.color;
  ctx.beginPath();
  ctx.roundRect(-l / 2, -w / 2, l, w, 2);
  ctx.fill();

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(-l / 2 + 2, -w / 2 + 1, l - 4, w - 2);

  if (!car.stopped) {
    ctx.fillStyle = C.headlight;
    ctx.beginPath();
    ctx.ellipse(l / 2 + 2.8, 0, 5.2, 1.8, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function drawWorld() {
  ctx.fillStyle = C.fringe;
  ctx.fillRect(0, 0, WORLD_W, WORLD_H);

  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (cityMask[y][x]) continue;
      const px = x * CELL;
      const py = y * CELL;
      ctx.fillStyle = ((x + y) % 3 === 0) ? C.fringe2 : C.fringe;
      ctx.fillRect(px, py, CELL, CELL);
    }
  }

  for (const b of buildingCache) {
    if (b.type === 'park') {
      // Draw park as green area
      const cellW = b.w * CELL;
      const cellH = b.h * CELL;
      ctx.fillStyle = b.toneDark ? C.park : C.parkLight;
      ctx.fillRect(b.px, b.py, cellW, cellH);
      // Draw tree dots
      ctx.fillStyle = C.parkTree;
      for (const tree of b.trees) {
        ctx.beginPath();
        ctx.arc(b.px + tree.tx, b.py + tree.ty, tree.size * 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (b.type === 'tower') {
      // Draw tower (multi-cell building with tighter blocks)
      const cellW = b.w * CELL;
      const cellH = b.h * CELL;
      const pad = b.pad;
      ctx.fillStyle = b.toneDark ? C.lot : C.lotAlt;
      ctx.beginPath();
      ctx.roundRect(b.px + pad, b.py + pad, cellW - pad * 2, cellH - pad * 2, 5);
      ctx.fill();
      for (const r of b.blocks) {
        ctx.fillStyle = r.dark ? C.roofA : C.roofB;
        ctx.beginPath();
        ctx.roundRect(b.px + r.bx, b.py + r.by, r.bw, r.bh, r.round);
        ctx.fill();
      }
    } else {
      // Draw regular 1x1 house
      const pad = b.pad;
      ctx.fillStyle = b.toneDark ? C.lot : C.lotAlt;
      ctx.beginPath();
      ctx.roundRect(b.px + pad, b.py + pad, CELL - pad * 2, CELL - pad * 2, 5);
      ctx.fill();
      for (const r of b.blocks) {
        ctx.fillStyle = r.dark ? C.roofA : C.roofB;
        ctx.beginPath();
        ctx.roundRect(b.px + r.bx, b.py + r.by, r.bw, r.bh, r.round);
        ctx.fill();
      }
    }
  }

  drawRoadNetwork();

  for (const car of cars) drawCar(car);
}

function drawScene() {
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(view.panX, view.panY);
  ctx.scale(view.zoom, view.zoom);
  drawWorld();
  ctx.restore();
}

function updateStats() {
  document.getElementById('s-tick').textContent = tickCount;
  document.getElementById('s-cars').textContent = cars.length;
  document.getElementById('s-done').textContent = completed.length;
  document.getElementById('s-stop').textContent = stoppedCount;
  const all = cars.concat(completed);
  const avg = all.length ? (all.reduce((s, c) => s + c.travelTime, 0) / all.length).toFixed(1) : '0.0';
  document.getElementById('s-avg').textContent = avg;
  document.getElementById('s-zoom').textContent = Math.round(view.zoom * 100) + '%';
}

function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

function resetView() {
  const fit = Math.min(canvas.width / WORLD_W, canvas.height / WORLD_H) * 0.94;
  view.zoom = clamp(fit, view.minZoom, view.maxZoom);
  view.panX = (canvas.width - WORLD_W * view.zoom) / 2;
  view.panY = (canvas.height - WORLD_H * view.zoom) / 2;
}

function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  resetView();
}

function zoomAt(screenX, screenY, factor) {
  const oldZoom = view.zoom;
  const newZoom = clamp(oldZoom * factor, view.minZoom, view.maxZoom);
  if (newZoom === oldZoom) return;

  const worldX = (screenX - view.panX) / oldZoom;
  const worldY = (screenY - view.panY) / oldZoom;
  view.zoom = newZoom;
  view.panX = screenX - worldX * newZoom;
  view.panY = screenY - worldY * newZoom;
}

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 0.89;
  zoomAt(e.offsetX, e.offsetY, factor);
}, { passive: false });

canvas.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  view.dragging = true;
  view.dragStartX = e.clientX - view.panX;
  view.dragStartY = e.clientY - view.panY;
  canvas.classList.add('dragging');
});

window.addEventListener('mousemove', (e) => {
  if (!view.dragging) return;
  view.panX = e.clientX - view.dragStartX;
  view.panY = e.clientY - view.dragStartY;
});

window.addEventListener('mouseup', () => {
  view.dragging = false;
  canvas.classList.remove('dragging');
});

window.addEventListener('resize', resizeCanvas);

let paused = false;
let speedMult = 1;
let tickAccum = 0;
let lastTime = 0;
const tickInterval = 120;

function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.1);
  lastTime = ts;

  if (!paused) {
    tickAccum += dt * 1000;
    const interval = tickInterval / speedMult;
    while (tickAccum >= interval) {
      simStep();
      tickAccum -= interval;
    }
  }

  for (const car of cars) car.updateRender(dt);

  drawScene();
  updateStats();
  requestAnimationFrame(loop);
}

function setSpeed(mult) {
  speedMult = mult;
  document.getElementById('btn-slow').classList.remove('active');
  document.getElementById('btn-norm').classList.remove('active');
  document.getElementById('btn-fast').classList.remove('active');
  document.getElementById(mult === 0.5 ? 'btn-slow' : mult === 1 ? 'btn-norm' : 'btn-fast').classList.add('active');
}

document.getElementById('btn-slow').onclick = () => setSpeed(0.5);
document.getElementById('btn-norm').onclick = () => setSpeed(1);
document.getElementById('btn-fast').onclick = () => setSpeed(3);

document.getElementById('btn-pause').onclick = function() {
  paused = !paused;
  this.textContent = paused ? 'Resume' : 'Pause';
  this.classList.toggle('active', paused);
};

document.getElementById('btn-zin').onclick = () => zoomAt(canvas.width * 0.5, canvas.height * 0.5, 1.12);
document.getElementById('btn-zout').onclick = () => zoomAt(canvas.width * 0.5, canvas.height * 0.5, 0.89);
document.getElementById('btn-zreset').onclick = () => resetView();

const tuneFields = [
  { key: 'highwaySeeds', input: 't-highway-seeds', value: 'v-highway-seeds', fmt: (v) => String(Math.round(v)), int: true },
  { key: 'highwayMinLenRatio', input: 't-highway-minlen', value: 'v-highway-minlen', fmt: (v) => Number(v).toFixed(2) },
  { key: 'highwayMaxLenMult', input: 't-highway-maxlen', value: 'v-highway-maxlen', fmt: (v) => Number(v).toFixed(2) },
  { key: 'mainBranchCap', input: 't-main-max', value: 'v-main-max', fmt: (v) => String(Math.round(v)), int: true },
  { key: 'mainFromHighwayFactor', input: 't-main-factor', value: 'v-main-factor', fmt: (v) => Number(v).toFixed(2) },
  { key: 'mainSkipChance', input: 't-main-skip', value: 'v-main-skip', fmt: (v) => Number(v).toFixed(2) },
  { key: 'localBaseCap', input: 't-local-base', value: 'v-local-base', fmt: (v) => String(Math.round(v)), int: true },
  { key: 'localAreaFactor', input: 't-local-area', value: 'v-local-area', fmt: (v) => Number(v).toFixed(3) },
  { key: 'localFromMainFactor', input: 't-local-main', value: 'v-local-main', fmt: (v) => Number(v).toFixed(2) },
  { key: 'localBranchExtra', input: 't-local-branch', value: 'v-local-branch', fmt: (v) => Number(v).toFixed(2) },
  { key: 'localLoopChance', input: 't-local-loop', value: 'v-local-loop', fmt: (v) => Number(v).toFixed(2) },
  { key: 'houseSpawnMult', input: 't-house-mult', value: 'v-house-mult', fmt: (v) => String(Math.round(v)), int: true },
  { key: 'localFrontageBias', input: 't-local-frontage', value: 'v-local-frontage', fmt: (v) => Number(v).toFixed(2) },
  { key: 'nearLocalBiasCap', input: 't-near-local', value: 'v-near-local', fmt: (v) => Number(v).toFixed(2) },
  { key: 'mainFrontageCap', input: 't-main-frontage-cap', value: 'v-main-frontage-cap', fmt: (v) => Number(v).toFixed(2) },
  { key: 'infillChance', input: 't-infill', value: 'v-infill', fmt: (v) => Number(v).toFixed(2) },
  { key: 'edgePruneLocal', input: 't-edge-local', value: 'v-edge-local', fmt: (v) => Number(v).toFixed(2) },
  { key: 'edgePruneMain', input: 't-edge-main', value: 'v-edge-main', fmt: (v) => Number(v).toFixed(2) },
];

function setTuningUiFromState() {
  for (const f of tuneFields) {
    const input = document.getElementById(f.input);
    const valueLabel = document.getElementById(f.value);
    if (!input || !valueLabel) continue;
    input.value = String(tuning[f.key]);
    valueLabel.textContent = f.fmt(tuning[f.key]);
  }
}

function wireTuningPreview() {
  for (const f of tuneFields) {
    const input = document.getElementById(f.input);
    const valueLabel = document.getElementById(f.value);
    if (!input || !valueLabel) continue;
    input.addEventListener('input', () => {
      valueLabel.textContent = f.fmt(Number(input.value));
    });
  }
}

function applyTuningFromUi() {
  for (const f of tuneFields) {
    const input = document.getElementById(f.input);
    if (!input) continue;
    const raw = Number(input.value);
    tuning[f.key] = f.int ? Math.round(raw) : raw;
  }
}

const genPanel = document.getElementById('gen-progress');
const genPhase = document.getElementById('gen-phase');
const genFill = document.getElementById('gen-fill');
const genMeta = document.getElementById('gen-meta');
const btnApplyRegenerate = document.getElementById('btn-apply-regenerate');

let generationInProgress = false;
let loopStarted = false;

function setGenerationProgress(pct, phase, meta = '') {
  genPanel.style.display = 'block';
  genPhase.textContent = phase;
  genFill.style.width = Math.max(0, Math.min(100, pct)) + '%';
  genMeta.textContent = meta;
}

async function initSimulation(startLoop = false) {
  if (generationInProgress) return;
  generationInProgress = true;
  btnApplyRegenerate.disabled = true;

  setGenerationProgress(2, 'Starting', 'Preparing generators...');
  await buildCity(setGenerationProgress);
  setGenerationProgress(96, 'Buildings', 'Placing lots...');
  await new Promise(requestAnimationFrame);
  generateBuildings();
  simReset();
  for (let i = 0; i < 20; i++) spawnCar();
  resizeCanvas();
  setGenerationProgress(100, 'Ready', 'Simulation running');
  setTimeout(() => {
    genPanel.style.display = 'none';
  }, 1200);

  generationInProgress = false;
  btnApplyRegenerate.disabled = false;

  if (startLoop && !loopStarted) {
    loopStarted = true;
    requestAnimationFrame((ts) => {
      lastTime = ts;
      requestAnimationFrame(loop);
    });
  }
}

btnApplyRegenerate.onclick = async () => {
  applyTuningFromUi();
  await initSimulation(false);
};

setTuningUiFromState();
wireTuningPreview();
initSimulation(true);
</script>
