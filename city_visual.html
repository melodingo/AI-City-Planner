<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CityFlow</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0f14;--surface:#13161e;--border:#1e2330;
  --text:#9aa3b8;--dim:#444d62;--accent:#f0b429;
  --red:#e05555;--blue:#4a9eff;--green:#3ecf8e;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'DM Mono',monospace}
#app{display:flex;flex-direction:column;height:100vh}

/* HUD */
#hud{
  display:flex;align-items:stretch;height:46px;
  background:var(--surface);border-bottom:1px solid var(--border);
  flex-shrink:0;z-index:10;
}
#logo{
  display:flex;align-items:center;padding:0 18px;
  border-right:1px solid var(--border);
  font-family:'Bebas Neue',sans-serif;font-size:20px;
  letter-spacing:.12em;color:var(--accent);white-space:nowrap;
}
.hud-stats{display:flex;flex:1;overflow:hidden}
.hstat{
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:0 14px;border-right:1px solid var(--border);min-width:72px;
}
.hstat .v{font-size:15px;font-weight:500;color:#e8ecf4;line-height:1}
.hstat .l{font-size:8px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.hstat .v.accent{color:var(--accent)}
.hstat .v.red{color:var(--red)}
.hstat .v.green{color:var(--green)}

/* time-of-day bar */
#tod-wrap{
  display:flex;align-items:center;gap:8px;padding:0 14px;
  border-right:1px solid var(--border);min-width:160px;
}
#tod-label{font-size:11px;color:var(--accent);min-width:44px;font-weight:500}
#tod-bar{flex:1;height:4px;background:#1e2330;border-radius:2px;overflow:hidden}
#tod-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
#tod-phase{font-size:8px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;min-width:50px;text-align:right}

/* controls */
.hud-controls{display:flex;align-items:stretch}
.hbtn{
  background:transparent;border:none;border-left:1px solid var(--border);
  color:var(--dim);font-family:'DM Mono',monospace;font-size:10px;
  padding:0 13px;cursor:pointer;transition:all .12s;letter-spacing:.05em;
  white-space:nowrap;
}
.hbtn:hover{color:var(--accent);background:rgba(240,180,41,.05)}
.hbtn.on{color:var(--accent);background:rgba(240,180,41,.08)}

/* canvas area */
#world-wrap{flex:1;position:relative;overflow:hidden;cursor:grab}
#world-wrap.grab{cursor:grabbing}
#city-canvas{display:block;position:absolute;top:0;left:0}

/* overlay panels */
.panel{
  position:absolute;background:rgba(13,15,20,.92);
  border:1px solid var(--border);padding:11px 13px;
  font-size:9px;pointer-events:none;
  backdrop-filter:blur(4px);
}
#legend{bottom:13px;right:13px}
.leg{display:flex;align-items:center;gap:7px;color:var(--dim);margin-bottom:3px}
.leg:last-child{margin-bottom:0}
.lsw{flex-shrink:0;border-radius:2px}

#minimap-canvas{
  position:absolute;bottom:13px;left:13px;
  border:1px solid var(--border);
  background:rgba(13,15,20,.92);
  backdrop-filter:blur(4px);
}
#toast{
  position:absolute;top:13px;left:50%;transform:translateX(-50%);
  background:rgba(13,15,20,.95);border:1px solid var(--border);
  padding:8px 16px;font-size:10px;color:var(--text);
  letter-spacing:.06em;white-space:nowrap;pointer-events:none;
  transition:opacity .4s;
}
#zoom-tip{bottom:13px;left:50%;transform:translateX(-50%);font-size:9px;
  color:var(--dim);letter-spacing:.1em;pointer-events:none;transition:opacity .5s}

/* generation overlay */
#gen-overlay{
  position:absolute;inset:0;background:rgba(13,15,20,.85);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:50;backdrop-filter:blur(6px);
}
#gen-box{
  background:var(--surface);border:1px solid var(--border);
  padding:28px 36px;min-width:300px;
}
#gen-title{font-family:'Bebas Neue',sans-serif;font-size:22px;
  letter-spacing:.15em;color:var(--accent);margin-bottom:14px}
#gen-phase{font-size:10px;color:var(--text);margin-bottom:8px;letter-spacing:.06em}
#gen-bar{height:3px;background:#1e2330;overflow:hidden}
#gen-bar-fill{height:100%;background:var(--accent);transition:width .15s}
#gen-meta{font-size:9px;color:var(--dim);margin-top:8px;min-height:14px;letter-spacing:.05em}
</style>
</head>
<body>
<div id="app">
<div id="hud">
  <div id="logo">CityFlow</div>
  <div class="hud-stats">
    <div class="hstat"><span class="v" id="s-tick">0</span><span class="l">Tick</span></div>
    <div class="hstat"><span class="v accent" id="s-cars">0</span><span class="l">Active</span></div>
    <div class="hstat"><span class="v green" id="s-done">0</span><span class="l">Arrived</span></div>
    <div class="hstat"><span class="v red" id="s-stop">0</span><span class="l">Stopped</span></div>
    <div class="hstat"><span class="v" id="s-avg">0.0</span><span class="l">Avg Trip</span></div>
    <div class="hstat"><span class="v" id="s-zoom">100%</span><span class="l">Zoom</span></div>
    <div id="tod-wrap">
      <span id="tod-label">06:00</span>
      <div id="tod-bar"><div id="tod-fill" style="width:25%"></div></div>
      <span id="tod-phase">DAWN</span>
    </div>
  </div>
  <div class="hud-controls">
    <button class="hbtn" id="btn-slow">0.5×</button>
    <button class="hbtn on" id="btn-norm">1×</button>
    <button class="hbtn" id="btn-fast">4×</button>
    <button class="hbtn" id="btn-zout">−</button>
    <button class="hbtn" id="btn-zreset">Fit</button>
    <button class="hbtn" id="btn-zin">+</button>
    <button class="hbtn" id="btn-pause">Pause</button>
    <button class="hbtn" id="btn-regen">New City</button>
  </div>
</div>

<div id="world-wrap">
  <canvas id="city-canvas"></canvas>
  <canvas id="minimap-canvas" width="140" height="100"></canvas>
  <div class="panel" id="legend">
    <div class="leg"><div class="lsw" style="width:18px;height:6px;background:#1a4060"></div>Highway · 4 lanes</div>
    <div class="leg"><div class="lsw" style="width:15px;height:5px;background:#1e3550"></div>Arterial · 2 lanes</div>
    <div class="leg"><div class="lsw" style="width:11px;height:3px;background:#1a2235"></div>Local · 1 lane</div>
    <div class="leg"><div class="lsw" style="width:10px;height:10px;background:#2a5c3a;border-radius:2px"></div>Park / Green</div>
    <div class="leg"><div class="lsw" style="width:8px;height:8px;border-radius:50%;background:#f0b429"></div>Moving car</div>
    <div class="leg"><div class="lsw" style="width:8px;height:8px;border-radius:50%;background:#e05555"></div>Stopped car</div>
  </div>
  <div class="panel" id="zoom-tip" style="bottom:13px;left:50%;transform:translateX(-50%)">Scroll · zoom &nbsp;|&nbsp; Drag · pan &nbsp;|&nbsp; New City · regenerate</div>
</div>

<div id="gen-overlay">
  <div id="gen-box">
    <div id="gen-title">Building City</div>
    <div id="gen-phase">Initialising…</div>
    <div id="gen-bar"><div id="gen-bar-fill" style="width:0%"></div></div>
    <div id="gen-meta"></div>
  </div>
</div>
</div>

<script>
'use strict';
// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const EMPTY=0,LOCAL=1,ARTERIAL=2,HIGHWAY=3,INTER=4;
const RANK={[LOCAL]:1,[ARTERIAL]:2,[HIGHWAY]:3};
const BIT={[LOCAL]:1,[ARTERIAL]:2,[HIGHWAY]:4};

// Grid: 200×144, cell=22px  → world 4400×3168 px
const GW=200,GH=144,CELL=22;
const WW=GW*CELL,WH=GH*CELL;

// Road pixel half-widths (each direction gets this on each side)
const RHW={[LOCAL]:4,[ARTERIAL]:7,[HIGHWAY]:12,[INTER]:8};

// Visual colours
const COL={
  bg:'#0c0e13',
  fringe:'#0e1018',
  cityGround:'#131720',
  zoneComm:'#12192a',
  zoneRes:'#111620',
  zoneInd:'#111418',
  park:'#152219',
  parkLight:'#1a2e20',
  parkTree:'#0f1c13',
  roadLocal:'#1a2030',
  roadArterial:'#1b3050',
  roadHighway:'#163558',
  roadHwyGlow:'rgba(40,130,220,.1)',
  inter:'#1e2840',
  laneDash:'rgba(220,230,255,.14)',
  laneHwy:'rgba(50,150,240,.22)',
  hwyMedian:'#0e1a28',
  lotBg:'#1a1e2c',
  lotBgAlt:'#171b28',
  roofA:'#48536a',
  roofB:'#546079',
  roofC:'#3e4858',
  towerGlass:'#1e3a5a',
  carStop:'#e05555',
  carShadow:'rgba(0,0,0,.5)',
  headlight:'rgba(255,240,160,.5)',
  signal_red:'#e05555',
  signal_green:'#3ecf8e',
  signal_amber:'#f0b429',
};

// ─── STATE ────────────────────────────────────────────────────────────────────
let grid,dirGrid,interMask,zone,cityMask,buildingCache=[];
let cars=[],completed=[],occupied=new Set(),interLocks=new Map();
let tickN=0,stoppedN=0,carId=0;
// Zone types: 0=none,1=CBD,2=commercial,3=residential,4=industrial,5=park
const Z={NONE:0,CBD:1,COM:2,RES:3,IND:4,PARK:5};

// Time-of-day: 0–1 over 24h sim-hours
let simTime=0.25; // start at 6am
const SIM_DAY=2400; // ticks per full day
let lastDayTick=0;

// Traffic demand by hour (0–23): multiplier on spawn rate
const HOURLY_DEMAND=[
  .1,.08,.07,.07,.08,.12, // 0-5 night→early
  .35,.80,.95,.75,.60,.55, // 6-11 morning rush
  .60,.58,.60,.62,.65,.75, // 12-17 daytime→pm
  .95,.85,.55,.38,.25,.15  // 18-23 evening rush→night
];

// ─── ARRAYS ───────────────────────────────────────────────────────────────────
function mk2d(h,w,v){return Array.from({length:h},()=>new Array(w).fill(v));}
function resetArrays(){
  grid=mk2d(GH,GW,EMPTY);
  dirGrid=mk2d(GH,GW,null);
  interMask=mk2d(GH,GW,0);
  zone=mk2d(GH,GW,Z.NONE);
  cityMask=mk2d(GH,GW,false);
}

// ─── GEOMETRY HELPERS ─────────────────────────────────────────────────────────
const inB=(x,y)=>x>=0&&y>=0&&x<GW&&y<GH;
const inC=(x,y)=>inB(x,y)&&cityMask[y][x];
const isDrv=(x,y)=>inC(x,y)&&grid[y][x]!==EMPTY;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const clampI=(v,lo,hi)=>Math.floor(clamp(v,lo,hi));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(lo,hi)=>lo+Math.random()*(hi-lo);
const irnd=(lo,hi)=>lo+(Math.random()*(hi-lo+1)|0);

function roadClassAt(x,y){
  const t=grid[y][x];
  if(t===LOCAL||t===ARTERIAL||t===HIGHWAY)return t;
  if(t===INTER){const m=interMask[y][x];if(m&BIT[HIGHWAY])return HIGHWAY;if(m&BIT[ARTERIAL])return ARTERIAL;return LOCAL;}
  return null;
}

function setRoad(x,y,rt,dir){
  if(!inC(x,y))return;
  const cur=grid[y][x];
  if(cur===EMPTY){grid[y][x]=rt;dirGrid[y][x]=dir;return;}
  if(cur===INTER){interMask[y][x]|=BIT[rt]||0;return;}
  if(dirGrid[y][x]===dir){
    if((RANK[rt]||0)>(RANK[cur]||0))grid[y][x]=rt;
    return;
  }
  grid[y][x]=INTER;dirGrid[y][x]='x';
  interMask[y][x]=(BIT[cur]||0)|(BIT[rt]||0);
}

function roadNbrs(x,y){
  const o=[];
  for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=x+dx,ny=y+dy;
    if(inC(nx,ny)&&grid[ny][nx]!==EMPTY)o.push({x:nx,y:ny});
  }
  return o;
}

// ─── CITY GENERATION ──────────────────────────────────────────────────────────
async function buildCity(prog){
  resetArrays();

  // 1. City boundary — slightly irregular ellipse with organic wobble
  prog(2,'Boundary mask');await af();
  const cx=GW*.5,cy=GH*.52,rx=GW*.46,ry=GH*.44;
  for(let y=0;y<GH;y++){
    for(let x=0;x<GW;x++){
      const nx=(x-cx)/rx,ny=(y-cy)/ry;
      const ang=Math.atan2(ny,nx);
      const w=.1*Math.sin(ang*3+1.2)+.07*Math.sin(ang*7-2)+.04*Math.cos(ang*11);
      const d=nx*nx+ny*ny;
      cityMask[y][x]=d<=(1+w)*(1+w);
    }
  }

  // 2. Zoning — CBD core, commercial ring, residential suburbs, industrial edges
  prog(5,'Zoning');await af();
  const distFromCenter=(x,y)=>Math.hypot((x-cx)/rx,(y-cy)/ry);
  for(let y=0;y<GH;y++){
    for(let x=0;x<GW;x++){
      if(!cityMask[y][x])continue;
      const d=distFromCenter(x,y);
      const ang=Math.atan2(y-cy,x-cx);
      // Industrial tends toward east/southeast edge
      const indBias=(Math.cos(ang-.4)*.5+.5);
      if(d<.18)zone[y][x]=Z.CBD;
      else if(d<.35)zone[y][x]=Z.COM;
      else if(d<.65)zone[y][x]=Z.RES;
      else if(d>.8&&indBias>.6&&Math.random()<.6)zone[y][x]=Z.IND;
      else zone[y][x]=Z.RES;
    }
  }

  // 3. Park placement — scatter parks in residential/CBD fringe
  prog(8,'Parks');await af();
  placeParks(cx,cy);

  // 4. Highways — radial spokes + ring road
  prog(12,'Highways');await af();
  buildHighways(cx,cy,rx,ry);

  // 5. Arterial grid — neighbourhood collector roads
  prog(38,'Arterial roads');await af();
  buildArterials(cx,cy,rx,ry);

  // 6. Local roads — organic growth from arterials
  prog(58,'Local streets');await af();
  buildLocals();

  // 7. Cleanup
  prog(80,'Network cleanup');await af();
  downgradeIsolatedHighways();
  pruneDeadEnds(2);
  keepLargestComponent();
  pruneDeadEnds(1);
  normaliseIntersections();

  // 8. Buildings
  prog(90,'Buildings & lots');await af();
  generateBuildings();

  prog(100,'Ready');
}

const af=()=>new Promise(requestAnimationFrame);

// ── Parks ──────────────────────────────────────────────────────────────────────
function placeParks(cx,cy){
  const parkSeeds=[];
  // CBD fringe parks
  for(let i=0;i<6;i++){
    const ang=rnd(0,Math.PI*2);
    const d=rnd(.25,.4);
    parkSeeds.push({x:cx+Math.cos(ang)*d*GW*.5,y:cy+Math.sin(ang)*d*GH*.5,r:irnd(4,9)});
  }
  // Large suburban parks
  for(let i=0;i<4;i++){
    const ang=rnd(0,Math.PI*2);
    const d=rnd(.45,.7);
    parkSeeds.push({x:cx+Math.cos(ang)*d*GW*.5,y:cy+Math.sin(ang)*d*GH*.5,r:irnd(5,14)});
  }
  for(const p of parkSeeds){
    const px=Math.round(p.x),py=Math.round(p.y);
    for(let dy=-p.r;dy<=p.r;dy++){
      for(let dx=-p.r;dx<=p.r;dx++){
        if(dx*dx+dy*dy>p.r*p.r)continue;
        const nx=px+dx,ny=py+dy;
        if(!inB(nx,ny)||!cityMask[ny][nx])continue;
        if(zone[ny][nx]!==Z.CBD)zone[ny][nx]=Z.PARK;
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// ROAD GENERATION
//
// Highway system — a real closed network, not disconnected blobs:
//   • 2–3 long H corridors that run edge-to-edge across the ENTIRE city width
//   • 2–3 long V corridors that run edge-to-edge across the ENTIRE city height
//   • Each corridor gets 1–3 gentle kinks (axis-locked jogs) so they feel
//     organic rather than perfectly straight
//   • A ring road is built by stitching the outermost corridors together
//     with short connector segments — guaranteed closure
//   • All of this means every highway tile is reachable from every other
//
// Arterials — kinked-straight grid with enforced minimum spacing:
//   • Regular spacing with per-line jitter, but each line is FULLY H or FULLY V
//   • Minimum gap enforced so lines never clump
//
// Locals — cooldown-gated growth from arterials (no clumping):
//   • 2D cooldown grid prevents adjacent sprouts
//   • Organic turn probability preserved from v4
// ═══════════════════════════════════════════════════════════════════════════════

// ── primitive draw helpers ────────────────────────────────────────────────────
function drawHSeg(y,x0,x1,rt){
  const lo=Math.min(x0,x1),hi=Math.max(x0,x1);
  for(let x=lo;x<=hi;x++){if(!inB(x,y))continue;cityMask[y][x]=true;setRoad(x,y,rt,'h');}
}
function drawVSeg(x,y0,y1,rt){
  const lo=Math.min(y0,y1),hi=Math.max(y0,y1);
  for(let y=lo;y<=hi;y++){if(!inB(x,y))continue;cityMask[y][x]=true;setRoad(x,y,rt,'v');}
}

function rowHasCityMask(y){
  if(y<0||y>=GH)return false;
  for(let x=0;x<GW;x++)if(cityMask[y][x])return true;return false;
}
function colHasCityMask(x){
  if(x<0||x>=GW)return false;
  for(let y=0;y<GH;y++)if(cityMask[y][x])return true;return false;
}

// ── HIGHWAYS: ring road + radial spokes ───────────────────────────────────────
// Architecture mirrors real cities (M25 + A-roads, Chicago Loop + I-highways):
//
//  1. RING ROAD — one large rectangular loop at ~60% of city radius.
//     Drawn as four pure H/V segments.  The loop is always closed.
//
//  2. RADIAL SPOKES — 3–5 spokes, evenly angled from city edge inward.
//     Each spoke travels primarily along one axis (H or V) with one small
//     midpoint jog, then terminates where it meets the ring perimeter.
//     The spoke is an L-shaped path: long leg → short connector to ring face.
//
//  3. OPTIONAL INNER CROSS — ~60% chance, adds one H + one V through the CBD.
//
//  Because every spoke connects to the ring, the whole highway network is one
//  connected graph — no orphaned blobs.
function buildHighways(cx,cy,rx,ry){
  // Ring dimensions — large enough to be clearly visible, not a tiny box
  const rfx=rnd(.55,.65), rfy=rnd(.55,.65);
  const rl=clampI(cx-rx*rfx+rnd(-3,3),3,GW-4);
  const rr=clampI(cx+rx*rfx+rnd(-3,3),3,GW-4);
  const rt2=clampI(cy-ry*rfy+rnd(-3,3),3,GH-4);
  const rb=clampI(cy+ry*rfy+rnd(-3,3),3,GH-4);

  // Draw the ring (four straight sides)
  drawHSeg(rt2,rl,rr,HIGHWAY);
  drawHSeg(rb, rl,rr,HIGHWAY);
  drawVSeg(rl, rt2,rb,HIGHWAY);
  drawVSeg(rr, rt2,rb,HIGHWAY);

  // Radial spokes: evenly spaced angles with small per-spoke jitter
  const nSpokes=irnd(3,5);
  for(let i=0;i<nSpokes;i++){
    const ang=(i/nSpokes)*Math.PI*2+rnd(-.3,.3);
    const cosA=Math.cos(ang), sinA=Math.sin(ang);

    // Entry point: city boundary
    const ex=clampI(cx+cosA*rx*.93,2,GW-3);
    const ey=clampI(cy+sinA*ry*.93,2,GH-3);
    cityMask[ey][ex]=true;

    // Where the spoke meets the ring face (closest face to the spoke angle)
    let ringX,ringY;
    if(Math.abs(cosA)>=Math.abs(sinA)){
      // Horizontal-dominant spoke → hits left or right side of ring
      ringX=cosA>0?rr:rl;
      ringY=clampI(cy+sinA*(rb-rt2)*.5+rnd(-4,4),rt2,rb);
    } else {
      // Vertical-dominant spoke → hits top or bottom of ring
      ringX=clampI(cx+cosA*(rr-rl)*.5+rnd(-4,4),rl,rr);
      ringY=sinA>0?rb:rt2;
    }

    // Draw: spoke goes along primary axis with one midpoint offset jog
    // so it's not perfectly straight (mirrors real highway bends)
    const midX=clampI((ex+ringX)/2+rnd(-6,6),2,GW-3);
    const midY=clampI((ey+ringY)/2+rnd(-5,5),2,GH-3);

    if(Math.abs(cosA)>=Math.abs(sinA)){
      // H-primary: horizontal to mid, small V jog, horizontal to ring face
      drawHSeg(ey, ex, midX, HIGHWAY);
      drawVSeg(midX, ey, midY, HIGHWAY);
      drawHSeg(midY, midX, ringX, HIGHWAY);
      // Short V connector to reach the ring row
      drawVSeg(ringX, midY, ringY, HIGHWAY);
    } else {
      // V-primary
      drawVSeg(ex, ey, midY, HIGHWAY);
      drawHSeg(midY, ex, midX, HIGHWAY);
      drawVSeg(midX, midY, ringY, HIGHWAY);
      drawHSeg(ringY, midX, ringX, HIGHWAY);
    }
  }

  // Optional inner cross through CBD (~60% chance)
  if(Math.random()<.6){
    const iy=clampI(cy+rnd(-7,7),rt2+1,rb-1);
    const ix=clampI(cx+rnd(-7,7),rl+1,rr-1);
    drawHSeg(iy,rl,rr,HIGHWAY);
    drawVSeg(ix,rt2,rb,HIGHWAY);
  }
}

// ── ARTERIALS ────────────────────────────────────────────────────────────────
// Kinked-straight lines with enforced minimum spacing.
// Each arterial is a sequence of axis-locked segments with occasional
// small parallel offsets (not diagonal steps) — gives the organic v4 feel
// without the zigzag clumping bug.
function buildArterials(cx,cy,rx,ry){
  const minSpacing=6;
  const nomH=irnd(7,11),nomV=irnd(7,11);

  // Horizontal arterials
  const sy0=clampI(cy-ry*.92,1,GH-2),sy1=clampI(cy+ry*.92,1,GH-2);
  let lastAY=-999;
  for(let y=sy0;y<=sy1;y+=nomH){
    const jy=clampI(y+irnd(-2,2),1,GH-2);
    if(!rowHasCityMask(jy))continue;
    if(jy-lastAY<minSpacing)continue;
    let lx=0,rx2=GW-1;
    while(lx<GW&&!cityMask[jy][lx])lx++;
    while(rx2>0&&!cityMask[jy][rx2])rx2--;
    if(lx>=rx2)continue;
    // Organic: split into 2–4 sub-segments with small vertical offsets between them
    const segs=irnd(2,4);
    let cx2=lx;
    let curY=jy;
    for(let s=0;s<segs;s++){
      const nextX=s===segs-1?rx2:clampI(lx+(rx2-lx)*((s+1)/segs)+irnd(-3,3),lx,rx2);
      drawHSeg(curY,cx2,nextX,ARTERIAL);
      if(s<segs-1){
        const nextY=clampI(curY+irnd(-2,2),1,GH-2);
        drawVSeg(nextX,curY,nextY,ARTERIAL);
        curY=nextY;
      }
      cx2=nextX;
    }
    lastAY=jy;
  }

  // Vertical arterials
  const sx0=clampI(cx-rx*.92,1,GW-2),sx1=clampI(cx+rx*.92,1,GW-2);
  let lastAX=-999;
  for(let x=sx0;x<=sx1;x+=nomV){
    const jx=clampI(x+irnd(-2,2),1,GW-2);
    if(!colHasCityMask(jx))continue;
    if(jx-lastAX<minSpacing)continue;
    let ty=0,by=GH-1;
    while(ty<GH&&!cityMask[ty][jx])ty++;
    while(by>0&&!cityMask[by][jx])by--;
    if(ty>=by)continue;
    const segs=irnd(2,4);
    let cy2=ty;
    let curX=jx;
    for(let s=0;s<segs;s++){
      const nextY=s===segs-1?by:clampI(ty+(by-ty)*((s+1)/segs)+irnd(-3,3),ty,by);
      drawVSeg(curX,cy2,nextY,ARTERIAL);
      if(s<segs-1){
        const nextX=clampI(curX+irnd(-2,2),1,GW-2);
        drawHSeg(nextY,curX,nextX,ARTERIAL);
        curX=nextX;
      }
      cy2=nextY;
    }
    lastAX=jx;
  }
}

function adjacentTo(x,y,rt){
  for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=x+dx,ny=y+dy;
    if(inB(nx,ny)&&roadClassAt(nx,ny)===rt)return true;
  }
  return false;
}

// ── LOCAL STREETS ────────────────────────────────────────────────────────────
// Cooldown grid prevents clumping; density roughly doubled vs v4c.
// MIN_GAP reduced to 3 (was 4), spawn rates raised, density cap raised to 6.
// Three passes: from arterials, from locals, and a fill pass for sparse areas.
function buildLocals(){
  const MIN_GAP=3;
  const cooldown=mk2d(GH,GW,0);

  function canGrow(x,y){
    for(let oy=-MIN_GAP;oy<=MIN_GAP;oy++)
      for(let ox=-MIN_GAP;ox<=MIN_GAP;ox++)
        if(inB(x+ox,y+oy)&&cooldown[y+oy][x+ox]>0)return false;
    return true;
  }
  function stamp(x,y){
    for(let oy=-MIN_GAP;oy<=MIN_GAP;oy++)
      for(let ox=-MIN_GAP;ox<=MIN_GAP;ox++)
        if(inB(x+ox,y+oy))cooldown[y+oy][x+ox]=MIN_GAP;
  }

  // Pass 1: from arterials — higher spawn rate (was .48 skip → now .35 skip)
  for(let y=0;y<GH;y++){
    for(let x=0;x<GW;x++){
      if(grid[y][x]!==ARTERIAL)continue;
      const d=dirGrid[y][x];if(!d||d==='x')continue;
      if(!canGrow(x,y))continue;
      if(Math.random()>.65)continue;  // 65% chance to sprout (was 52%)
      const perps=d==='h'?[[0,1],[0,-1]]:[[1,0],[-1,0]];
      for(const[pdx,pdy]of perps){
        if(Math.random()>.78)continue;  // each side 78% chance (was 65%)
        growLocalStreet(x+pdx,y+pdy,pdx,pdy);
      }
      stamp(x,y);
    }
  }
  // Pass 2: from locals — secondary branching (was .28 → now .42)
  for(let y=0;y<GH;y++){
    for(let x=0;x<GW;x++){
      if(grid[y][x]!==LOCAL)continue;
      const d=dirGrid[y][x];if(!d||d==='x')continue;
      if(!canGrow(x,y))continue;
      if(Math.random()>.42)continue;
      const[pdx,pdy]=d==='h'?(Math.random()<.5?[0,1]:[0,-1]):(Math.random()<.5?[1,0]:[-1,0]);
      growLocalStreet(x+pdx,y+pdy,pdx,pdy);
      stamp(x,y);
    }
  }
  // Pass 3: extra fill — target any empty city cell that has no local within 5
  // tiles.  Grow a short stub from the nearest arterial neighbour.
  for(let y=2;y<GH-2;y++){
    for(let x=2;x<GW-2;x++){
      if(!inC(x,y)||grid[y][x]!==EMPTY)continue;
      if(zone[y][x]===Z.PARK)continue;
      // Check if already close to a local
      let nearLocal=false;
      outer:for(let oy=-5;oy<=5;oy++)for(let ox=-5;ox<=5;ox++)
        if(inB(x+ox,y+oy)&&roadClassAt(x+ox,y+oy)===LOCAL){nearLocal=true;break outer;}
      if(nearLocal)continue;
      if(!canGrow(x,y))continue;
      if(Math.random()>.55)continue;
      // Pick a random cardinal direction that leads into the empty block
      const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
      for(const[dx,dy]of dirs){
        if(Math.random()>.5)continue;
        growLocalStreet(x,y,dx,dy);
        stamp(x,y);
        break;
      }
    }
  }
}

function growLocalStreet(sx,sy,dx,dy){
  const path=[];
  let x=sx,y=sy;
  const maxLen=irnd(5,16);  // slightly longer streets (was 4–15)
  for(let i=0;i<maxLen;i++){
    if(!inC(x,y))break;
    if(grid[y][x]!==EMPTY){
      if(grid[y][x]===LOCAL&&i>1&&Math.random()<.35)break;
      if(grid[y][x]!==LOCAL)break;
    }
    if(adjacentTo(x,y,HIGHWAY))break;
    let localNb=0;
    for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++)
      if((ox||oy)&&inB(x+ox,y+oy)&&roadClassAt(x+ox,y+oy)===LOCAL)localNb++;
    if(localNb>6)break;  // denser local grid allowed (was >4)
    setRoad(x,y,LOCAL,dx!==0?'h':'v');
    path.push({x,y});
    if(Math.random()<.18){const t=dx;dx=dy;dy=t;if(!dx&&!dy)dx=1;}
    x+=dx;y+=dy;
  }
  return path;
}

// ── Cleanup ───────────────────────────────────────────────────────────────────
function downgradeIsolatedHighways(){
  const seen=mk2d(GH,GW,false);
  for(let y=0;y<GH;y++){
    for(let x=0;x<GW;x++){
      if(seen[y][x]||grid[y][x]!==HIGHWAY)continue;
      const comp=[],q=[{x,y}];seen[y][x]=true;
      let artTouches=0;
      while(q.length){
        const c=q.pop();comp.push(c);
        for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
          const nx=c.x+dx,ny=c.y+dy;
          if(!inB(nx,ny))continue;
          const cls=roadClassAt(nx,ny);
          if(cls===ARTERIAL)artTouches++;
          if(!seen[ny][nx]&&grid[ny][nx]===HIGHWAY){seen[ny][nx]=true;q.push({x:nx,y:ny});}
        }
      }
      if(comp.length<25||artTouches<1){
        for(const c of comp){grid[c.y][c.x]=ARTERIAL;if(dirGrid[c.y][c.x]==='x')dirGrid[c.y][c.x]='h';}
      }
    }
  }
}

function pruneDeadEnds(minNbrs){
  let changed=true;
  for(let pass=0;pass<5&&changed;pass++){
    changed=false;
    for(let y=1;y<GH-1;y++){
      for(let x=1;x<GW-1;x++){
        if(!grid[y][x]||grid[y][x]===EMPTY||roadClassAt(x,y)===HIGHWAY)continue;
        if(roadNbrs(x,y).length<=minNbrs-1){
          grid[y][x]=EMPTY;dirGrid[y][x]=null;interMask[y][x]=0;changed=true;
        }
      }
    }
  }
}

function keepLargestComponent(){
  const seen=mk2d(GH,GW,false);const comps=[];
  for(let y=0;y<GH;y++){
    for(let x=0;x<GW;x++){
      if(seen[y][x]||!grid[y][x])continue;
      const q=[{x,y}],comp=[];seen[y][x]=true;
      while(q.length){const c=q.pop();comp.push(c);for(const n of roadNbrs(c.x,c.y)){if(!seen[n.y][n.x]){seen[n.y][n.x]=true;q.push(n);}}}
      comps.push(comp);
    }
  }
  if(comps.length<=1)return;
  comps.sort((a,b)=>b.length-a.length);
  const keep=new Set(comps[0].map(c=>c.x+','+c.y));
  for(let i=1;i<comps.length;i++)
    for(const c of comps[i])
      if(!keep.has(c.x+','+c.y)){grid[c.y][c.x]=EMPTY;dirGrid[c.y][c.x]=null;interMask[c.y][c.x]=0;}
}

function normaliseIntersections(){
  for(let y=0;y<GH;y++){
    for(let x=0;x<GW;x++){
      if(grid[y][x]!==INTER)continue;
      const nb=roadNbrs(x,y);
      if(nb.length===0){grid[y][x]=EMPTY;dirGrid[y][x]=null;interMask[y][x]=0;}
      else if(nb.length===1){
        grid[y][x]=roadClassAt(nb[0].x,nb[0].y)||LOCAL;
        dirGrid[y][x]=nb[0].x===x?'v':'h';interMask[y][x]=0;
      } else if(nb.length===2&&nb[0].x===nb[1].x){
        grid[y][x]=Math.max(roadClassAt(nb[0].x,nb[0].y)||LOCAL,roadClassAt(nb[1].x,nb[1].y)||LOCAL);
        dirGrid[y][x]='v';interMask[y][x]=0;
      } else if(nb.length===2&&nb[0].y===nb[1].y){
        grid[y][x]=Math.max(roadClassAt(nb[0].x,nb[0].y)||LOCAL,roadClassAt(nb[1].x,nb[1].y)||LOCAL);
        dirGrid[y][x]='h';interMask[y][x]=0;
      } else {
        let m=0;for(const n of nb){const c=roadClassAt(n.x,n.y);if(c)m|=BIT[c];}
        interMask[y][x]=m||BIT[LOCAL];dirGrid[y][x]='x';
      }
    }
  }
  // patch stray zero masks
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)
    if(grid[y][x]===INTER&&!interMask[y][x])interMask[y][x]=BIT[LOCAL]|BIT[ARTERIAL];
}

// ─── BUILDINGS ────────────────────────────────────────────────────────────────
function generateBuildings(){
  buildingCache=[];
  const placed=mk2d(GH,GW,false);

  function hasFrontage(x,y){
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;
      if(inC(nx,ny)&&grid[ny][nx]!==EMPTY)return true;
    }
    return false;
  }

  function canOccupy(x,y,w,h){
    for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++){
      const nx=x+dx,ny=y+dy;
      if(!inC(nx,ny)||grid[ny][nx]!==EMPTY||placed[ny][nx])return false;
    }
    return true;
  }
  function occupy(x,y,w,h){for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++)placed[y+dy][x+dx]=true;}

  function spawnChance(x,y){
    const z=zone[y][x];
    if(z===Z.PARK)return 0;
    // Check what type of road this cell has frontage on
    let hasLocal=false,hasArterial=false,hasHighway=false;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;
      if(!inC(nx,ny))continue;
      const cls=roadClassAt(nx,ny);
      if(cls===LOCAL)hasLocal=true;
      else if(cls===ARTERIAL||cls===INTER)hasArterial=true;
      else if(cls===HIGHWAY)hasHighway=true;
    }
    if(!hasLocal&&!hasArterial&&!hasHighway)return 0;
    // Local-road frontage → dense residential fill (real neighborhoods)
    if(hasLocal){
      if(z===Z.CBD)return .88;
      if(z===Z.COM)return .82;
      if(z===Z.RES)return .95;  // nearly every local lot gets a house
      if(z===Z.IND)return .80;
      return .75;
    }
    // Arterial frontage — slightly less dense
    if(z===Z.CBD)return .92;
    if(z===Z.COM)return .80;
    if(z===Z.RES)return .72;
    if(z===Z.IND)return .65;
    return .3;
  }

  for(let y=0;y<GH;y++){
    for(let x=0;x<GW;x++){
      if(!inC(x,y)||grid[y][x]!==EMPTY||placed[y][x])continue;
      const z=zone[y][x];
      if(z===Z.PARK){placed[y][x]=true;continue;}
      if(!hasFrontage(x,y))continue;
      if(Math.random()>spawnChance(x,y))continue;

      // CBD + Commercial: try large towers first
      if(z===Z.CBD&&Math.random()<.4){
        const w=irnd(2,4),h=irnd(2,4);
        if(canOccupy(x,y,w,h)){addTower(x,y,w,h);occupy(x,y,w,h);continue;}
      }
      if(z===Z.COM&&Math.random()<.25){
        const w=irnd(2,3),h=irnd(1,2);
        if(canOccupy(x,y,w,h)){addTower(x,y,w,h);occupy(x,y,w,h);continue;}
      }
      if(z===Z.IND&&Math.random()<.3){
        const w=irnd(2,4),h=irnd(1,3);
        if(canOccupy(x,y,w,h)){addWarehouse(x,y,w,h);occupy(x,y,w,h);continue;}
      }
      addHouse(x,y,z);occupied;placed[y][x]=true;
    }
  }

  // Park ground tiles
  for(let y=0;y<GH;y++){
    for(let x=0;x<GW;x++){
      if(!inC(x,y)||grid[y][x]!==EMPTY||placed[y][x])continue;
      if(zone[y][x]===Z.PARK)buildingCache.push({type:'park',px:x*CELL,py:y*CELL,
        trees:Array.from({length:irnd(1,3)},()=>({tx:rnd(3,CELL-3),ty:rnd(3,CELL-3),r:rnd(2,4)}))});
    }
  }
}

function addHouse(x,y,z){
  const px=x*CELL,py=y*CELL,m=3;
  const bw=irnd(6,CELL-m*2-3),bh=irnd(6,CELL-m*2-3);
  const bx=irnd(m,CELL-m-bw),by=irnd(m,CELL-m-bh);
  const dark=Math.random()<.5;
  const roofCol=z===Z.CBD?COL.towerGlass:z===Z.IND?COL.roofC:dark?COL.roofA:COL.roofB;
  buildingCache.push({type:'house',px,py,bx,by,bw,bh,roofCol,rx:irnd(1,3),dark});
}

function addTower(x,y,w,h){
  const px=x*CELL,py=y*CELL,cw=w*CELL,ch=h*CELL;
  const floors=irnd(2,4);const blocks=[];
  for(let i=0;i<floors;i++){
    const m=2+i,bw=cw-m*2,bh=ch-m*2;
    blocks.push({bx:m,by:m,bw,bh,glass:Math.random()<.5});
  }
  buildingCache.push({type:'tower',px,py,cw,ch,blocks});
}

function addWarehouse(x,y,w,h){
  const px=x*CELL,py=y*CELL,cw=w*CELL,ch=h*CELL;
  buildingCache.push({type:'warehouse',px,py,cw,ch});
}

// ─── PATHFINDING ──────────────────────────────────────────────────────────────
function canConnectClass(a,b){
  if(!a||!b)return false;
  if(a===HIGHWAY&&b===LOCAL)return false;
  if(a===LOCAL&&b===HIGHWAY)return false;
  return true;
}
function dirCompat(dir,dx,dy){
  if(dir==='h')return dy===0;
  if(dir==='v')return dx===0;
  return true;
}
function interAccepts(ix,iy,cls){
  return grid[iy][ix]!==INTER||(interMask[iy][ix]&BIT[cls])!==0;
}

function nbrs(x,y){
  const res=[];
  const sd=dirGrid[y][x],st=grid[y][x];
  const sc=st===INTER?null:st;
  for(const{dx,dy}of[{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}]){
    const nx=x+dx,ny=y+dy;
    if(!isDrv(nx,ny))continue;
    const dt=grid[ny][nx],dc=dt===INTER?null:dt,dd=dirGrid[ny][nx];
    if(!dirCompat(sd,dx,dy)||!dirCompat(dd,dx,dy))continue;
    if(sc&&dc&&!canConnectClass(sc,dc))continue;
    if(st===INTER&&dc&&!interAccepts(x,y,dc))continue;
    if(dt===INTER&&sc&&!interAccepts(nx,ny,sc))continue;
    if(st===INTER&&dt===INTER&&!(interMask[y][x]&interMask[ny][nx]))continue;
    res.push({x:nx,y:ny,dx,dy});
  }
  return res;
}

function moveCost(x,y){
  switch(grid[y][x]){case HIGHWAY:return 1;case ARTERIAL:return 2;default:return 3;}
}

function astar(sx,sy,gx,gy){
  if(sx===gx&&sy===gy)return[{x:sx,y:sy,dx:0,dy:0}];
  const K=(x,y)=>y*GW+x;
  const open=[{x:sx,y:sy,g:0,f:Math.abs(sx-gx)+Math.abs(sy-gy),dx:0,dy:0}];
  const gs={[K(sx,sy)]:0},fr={};
  while(open.length){
    let bi=0;for(let i=1;i<open.length;i++)if(open[i].f<open[bi].f)bi=i;
    const cur=open.splice(bi,1)[0];
    if(cur.x===gx&&cur.y===gy){
      const p=[];let c=cur;while(c){p.unshift(c);c=fr[K(c.x,c.y)]||null;}return p;
    }
    for(const nb of nbrs(cur.x,cur.y)){
      const ng=(gs[K(cur.x,cur.y)]||0)+moveCost(nb.x,nb.y);
      const nk=K(nb.x,nb.y);
      if(ng<(gs[nk]??1e9)){
        gs[nk]=ng;fr[nk]=cur;
        open.push({x:nb.x,y:nb.y,g:ng,f:ng+Math.abs(nb.x-gx)+Math.abs(nb.y-gy),dx:nb.dx,dy:nb.dy});
      }
    }
  }
  return null;
}

// ─── LANE POSITIONING ─────────────────────────────────────────────────────────
// Returns pixel center for a car on given tile, heading dx/dy, in given lane slot
function lanePixel(gx,gy,dx,dy,laneSlot){
  const cx=gx*CELL+CELL/2,cy=gy*CELL+CELL/2;
  const t=grid[gy][gx];
  if(t===INTER||(dx===0&&dy===0))return{x:cx,y:cy};
  // offset perpendicular to direction of travel, biased to right side
  let off;
  if(t===HIGHWAY){off=laneSlot===0?3.5:7.5;} // 2 lanes per direction
  else if(t===ARTERIAL){off=4;}
  else{off=3;}
  if(dx>0)return{x:cx,y:cy+off};   // eastbound → lower lane
  if(dx<0)return{x:cx,y:cy-off};   // westbound → upper lane
  if(dy>0)return{x:cx+off,y:cy};   // southbound → right lane
  if(dy<0)return{x:cx-off,y:cy};   // northbound → left lane
  return{x:cx,y:cy};
}

// ─── CAR CLASS ────────────────────────────────────────────────────────────────
const CAR_COLORS=['#f0b429','#f0b429','#f0b429','#7cb6f5','#95de7f','#e08060','#c0a0f0'];

class Car{
  constructor(x,y,gx,gy,path){
    this.id=carId++;this.x=x;this.y=y;this.gx=gx;this.gy=gy;
    this.path=path.slice(1);
    this.dx=path.length>1?path[1].dx:1;
    this.dy=path.length>1?path[1].dy:0;
    this.laneSlot=Math.random()<.5?0:1;
    this.travel=0;this.stopped=false;
    this.col=CAR_COLORS[Math.random()*CAR_COLORS.length|0];
    this.len=8+(Math.random()*4|0);this.wid=4.5;
    const p=lanePixel(x,y,this.dx,this.dy,this.laneSlot);
    this.rx=p.x;this.ry=p.y;this.trx=p.x;this.try=p.y;
    this.angle=Math.atan2(this.dy,this.dx);this.tAngle=this.angle;
    this.lt=1;
    // District origin for metrics
    this.originZone=zone[y][x];
  }
  get arrived(){return this.x===this.gx&&this.y===this.gy;}
  nextStep(){return this.path.length?this.path[0]:null;}
  advance(){
    const n=this.path.shift();
    this.dx=n.dx;this.dy=n.dy;this.x=n.x;this.y=n.y;
    const t=grid[n.y][n.x];
    if(t!==HIGHWAY)this.laneSlot=0;
    else if(Math.random()<.04)this.laneSlot^=1;
    const p=lanePixel(n.x,n.y,n.dx,n.dy,this.laneSlot);
    this.trx=p.x;this.try=p.y;
    this.tAngle=Math.atan2(n.dy,n.dx);
    this.lt=0;this.travel++;this.stopped=false;
  }
  tickStop(){this.stopped=true;this.travel++;}
  update(dt){
    this.lt=Math.min(1,this.lt+dt*9);
    const e=this.lt<.5?2*this.lt*this.lt:-1+(4-2*this.lt)*this.lt;
    const s=this.stopped?.35:.55;
    this.rx+=(this.trx-this.rx)*Math.min(1,dt*9*s+e*.2);
    this.ry+=(this.try-this.ry)*Math.min(1,dt*9*s+e*.2);
    let da=this.tAngle-this.angle;
    while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
    this.angle+=da*.3;
  }
}

// ─── SIMULATION ───────────────────────────────────────────────────────────────
const MAX_CARS=180;
let drvTilesCache=null;
let drvByZone={};

function buildDrvCache(){
  drvTilesCache=[];drvByZone={};
  for(const z of[Z.CBD,Z.COM,Z.RES,Z.IND])drvByZone[z]=[];
  for(let y=0;y<GH;y++){
    for(let x=0;x<GW;x++){
      if(!isDrv(x,y))continue;
      drvTilesCache.push({x,y});
      const z2=zone[y][x];
      if(drvByZone[z2])drvByZone[z2].push({x,y});
    }
  }
}

function oKey(x,y){return x*1000+y;}

function simReset(){
  cars=[];completed=[];occupied=new Set();interLocks=new Map();
  tickN=0;stoppedN=0;carId=0;simTime=.25;lastDayTick=0;
  drvTilesCache=null;
}

function currentHour(){return(simTime*24|0)%24;}

function spawnDemand(){
  const h=currentHour();
  return HOURLY_DEMAND[h];
}

// Pick origin zone biased by time of day (morning: from RES; evening: from COM/CBD)
function pickOriginZone(){
  const h=currentHour();
  if(h>=6&&h<=9){// morning rush: mostly from residential
    return Math.random()<.72?Z.RES:Math.random()<.5?Z.COM:Z.CBD;
  }
  if(h>=17&&h<=20){// evening rush: from CBD/COM back to RES
    return Math.random()<.65?Z.CBD:Math.random()<.5?Z.COM:Z.RES;
  }
  return[Z.CBD,Z.COM,Z.RES,Z.IND][Math.random()*4|0];
}
function pickDestZone(origZone){
  const h=currentHour();
  if(h>=6&&h<=9){
    if(origZone===Z.RES)return Math.random()<.7?Z.CBD:Z.COM;
  }
  if(h>=17&&h<=20){
    if(origZone===Z.CBD||origZone===Z.COM)return Z.RES;
  }
  const opts=[Z.CBD,Z.COM,Z.RES,Z.IND].filter(z=>z!==origZone);
  return opts[Math.random()*opts.length|0];
}

function tilesForZone(z){
  const pool=drvByZone[z];
  return(pool&&pool.length>2)?pool:drvTilesCache;
}

function spawnCar(){
  if(!drvTilesCache)buildDrvCache();
  if(cars.length>=MAX_CARS)return;
  const demand=spawnDemand();
  if(Math.random()>demand*.7)return;

  const origZone=pickOriginZone();
  const destZone=pickDestZone(origZone);
  const srcPool=tilesForZone(origZone);
  const dstPool=tilesForZone(destZone);
  if(!srcPool.length||!dstPool.length)return;

  for(let t=0;t<20;t++){
    const s=srcPool[Math.random()*srcPool.length|0];
    const d=dstPool[Math.random()*dstPool.length|0];
    if(s.x===d.x&&s.y===d.y)continue;
    if(occupied.has(oKey(s.x,s.y)))continue;
    const path=astar(s.x,s.y,d.x,d.y);
    if(!path||path.length<2)continue;
    const c=new Car(s.x,s.y,d.x,d.y,path);
    cars.push(c);occupied.add(oKey(s.x,s.y));return;
  }
}

// Traffic signal state: intersections cycle green/red
// Each intersection gets a phase (0 or 1) and a timer
const signalPhase=new Map();
const signalTimer=new Map();
const SIGNAL_CYCLE=18; // ticks per phase

function updateSignals(){
  // Only large intersections (HIGHWAY or ARTERIAL) have signals
  for(let y=0;y<GH;y++){
    for(let x=0;x<GW;x++){
      if(grid[y][x]!==INTER)continue;
      const m=interMask[y][x]||0;
      if(!(m&BIT[HIGHWAY])&&!(m&BIT[ARTERIAL]))continue;
      const k=oKey(x,y);
      let timer=(signalTimer.get(k)||0)+1;
      if(timer>=SIGNAL_CYCLE){timer=0;signalPhase.set(k,(signalPhase.get(k)||0)^1);}
      signalTimer.set(k,timer);
    }
  }
}

function signalAllows(nx,ny,dx,dy){
  if(grid[ny][nx]!==INTER)return true;
  const m=interMask[ny][nx]||0;
  if(!(m&BIT[HIGHWAY])&&!(m&BIT[ARTERIAL]))return true; // local intersections free-flowing
  const k=oKey(nx,ny);
  const phase=signalPhase.get(k)||0;
  // Phase 0: horizontal passes; Phase 1: vertical passes
  return phase===0?dy===0:dx===0;
}

function simStep(){
  tickN++;
  // Advance time of day
  simTime=(simTime+1/SIM_DAY)%1;
  updateSignals();
  interLocks.clear();stoppedN=0;
  // Shuffle for fairness
  for(let i=cars.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[cars[i],cars[j]]=[cars[j],cars[i]];}

  for(const c of cars){
    c.stopped=false;
    let nxt=c.nextStep();
    if(!nxt){
      if(!c.arrived){const p=astar(c.x,c.y,c.gx,c.gy);if(p&&p.length>1){c.path=p.slice(1);nxt=c.nextStep();}}
      if(!nxt){c.tickStop();stoppedN++;continue;}
    }
    const nk=oKey(nxt.x,nxt.y);
    if(occupied.has(nk)){c.tickStop();stoppedN++;continue;}
    if(grid[nxt.y][nxt.x]===INTER){
      if(!signalAllows(nxt.x,nxt.y,nxt.dx,nxt.dy)){c.tickStop();stoppedN++;continue;}
      if(interLocks.has(nk)){c.tickStop();stoppedN++;continue;}
      interLocks.set(nk,c.id);
    }
    occupied.delete(oKey(c.x,c.y));
    c.advance();
    occupied.add(oKey(c.x,c.y));
  }

  cars=cars.filter(c=>{
    if(c.arrived){occupied.delete(oKey(c.x,c.y));completed.push(c);return false;}
    return true;
  });
  // Trim completed array to avoid memory bloat
  if(completed.length>2000)completed.splice(0,500);
  spawnCar();
}

// ─── RENDERING ────────────────────────────────────────────────────────────────
const canvas=document.getElementById('city-canvas');
const ctx=canvas.getContext('2d');
const mmCanvas=document.getElementById('minimap-canvas');
const mmCtx=mmCanvas.getContext('2d');

const view={zoom:1,panX:0,panY:0,drag:false,dragX:0,dragY:0,minZ:.05,maxZ:3};

function toScreen(wx,wy){return{x:wx*view.zoom+view.panX,y:wy*view.zoom+view.panY};}
function toWorld(sx,sy){return{x:(sx-view.panX)/view.zoom,y:(sy-view.panY)/view.zoom};}

function visibleTileRange(){
  const tl=toWorld(0,0),br=toWorld(canvas.width,canvas.height);
  return{
    x0:Math.max(0,Math.floor(tl.x/CELL)-1),
    y0:Math.max(0,Math.floor(tl.y/CELL)-1),
    x1:Math.min(GW,Math.ceil(br.x/CELL)+1),
    y1:Math.min(GH,Math.ceil(br.y/CELL)+1),
  };
}

// Road link drawing — uses canvas paths for smooth, thick strokes
function drawRoads(range){
  // Build link list in rank order (draw low roads first so high roads on top)
  const links=[];
  const{x0,y0,x1,y1}=range;
  for(let y=y0;y<y1;y++){
    for(let x=x0;x<x1;x++){
      if(!isDrv(x,y))continue;
      if(isDrv(x+1,y))links.push({ax:x,ay:y,bx:x+1,by:y});
      if(isDrv(x,y+1))links.push({ax:x,ay:y,bx:x,by:y+1});
    }
  }

  function maxClass(ax,ay,bx,by){
    const a=roadClassAt(ax,ay)||LOCAL,b=roadClassAt(bx,by)||LOCAL;
    return Math.max(a,b);
  }

  // Sort: LOCAL first, then ARTERIAL, then HIGHWAY (paint on top)
  links.sort((a,b)=>maxClass(a.ax,a.ay,a.bx,a.by)-maxClass(b.ax,b.ay,b.bx,b.by));

  const scale=view.zoom;

  // Shadow pass
  for(const l of links){
    const rt=maxClass(l.ax,l.ay,l.bx,l.by);
    const hw=RHW[rt]*scale;
    const A={x:l.ax*CELL*scale+view.panX+(CELL/2)*scale,y:l.ay*CELL*scale+view.panY+(CELL/2)*scale};
    const B={x:l.bx*CELL*scale+view.panX+(CELL/2)*scale,y:l.by*CELL*scale+view.panY+(CELL/2)*scale};
    ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);
    ctx.lineWidth=hw*2+4*scale;ctx.strokeStyle='rgba(0,0,0,.35)';
    ctx.lineCap='round';ctx.stroke();
  }
  // Road surface pass
  for(const l of links){
    const rt=maxClass(l.ax,l.ay,l.bx,l.by);
    const hw=RHW[rt]*scale;
    const col=rt===HIGHWAY?COL.roadHighway:rt===ARTERIAL?COL.roadArterial:COL.roadLocal;
    const A={x:l.ax*CELL*scale+view.panX+(CELL/2)*scale,y:l.ay*CELL*scale+view.panY+(CELL/2)*scale};
    const B={x:l.bx*CELL*scale+view.panX+(CELL/2)*scale,y:l.by*CELL*scale+view.panY+(CELL/2)*scale};
    ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);
    ctx.lineWidth=hw*2;ctx.strokeStyle=col;ctx.lineCap='round';ctx.stroke();
    // Highway glow edge
    if(rt===HIGHWAY){
      ctx.lineWidth=hw*2+2*scale;ctx.strokeStyle=COL.roadHwyGlow;ctx.stroke();
    }
  }
  // Lane markings (only at zoom > 0.4)
  if(scale>.4){
    ctx.save();
    for(const l of links){
      const rt=maxClass(l.ax,l.ay,l.bx,l.by);
      const hw=RHW[rt]*scale;
      const A={x:l.ax*CELL*scale+view.panX+(CELL/2)*scale,y:l.ay*CELL*scale+view.panY+(CELL/2)*scale};
      const B={x:l.bx*CELL*scale+view.panX+(CELL/2)*scale,y:l.by*CELL*scale+view.panY+(CELL/2)*scale};
      const lx=B.x-A.x,ly=B.y-A.y,len=Math.hypot(lx,ly);
      if(len<1)continue;
      const nx=-ly/len,ny=lx/len;
      if(rt===HIGHWAY){
        // Solid edge lines
        ctx.setLineDash([]);ctx.lineWidth=scale*.8;ctx.strokeStyle=COL.laneHwy;
        for(const s of[-1,1]){
          ctx.beginPath();ctx.moveTo(A.x+nx*hw*.85*s,A.y+ny*hw*.85*s);
          ctx.lineTo(B.x+nx*hw*.85*s,B.y+ny*hw*.85*s);ctx.stroke();
        }
        // Centre median
        ctx.lineWidth=scale*1.5;ctx.strokeStyle=COL.hwyMedian;ctx.setLineDash([]);
        ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();
        // Lane splits (dashed)
        ctx.setLineDash([6*scale,5*scale]);ctx.lineWidth=scale*.6;ctx.strokeStyle=COL.laneDash;
        for(const s of[-.48,.48]){
          ctx.beginPath();ctx.moveTo(A.x+nx*hw*s,A.y+ny*hw*s);
          ctx.lineTo(B.x+nx*hw*s,B.y+ny*hw*s);ctx.stroke();
        }
      } else if(rt===ARTERIAL){
        ctx.setLineDash([5*scale,5*scale]);ctx.lineWidth=scale*.7;ctx.strokeStyle=COL.laneDash;
        ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();
      }
    }
    ctx.setLineDash([]);
    ctx.restore();
  }

  // Intersection pads
  for(let y=y0;y<y1;y++){
    for(let x=x0;x<x1;x++){
      if(grid[y][x]!==INTER)continue;
      const mask=interMask[y][x]||0;
      const cls=mask&BIT[HIGHWAY]?HIGHWAY:mask&BIT[ARTERIAL]?ARTERIAL:LOCAL;
      const hw=RHW[INTER]*scale;
      const sx=x*CELL*scale+view.panX+(CELL/2)*scale;
      const sy=y*CELL*scale+view.panY+(CELL/2)*scale;
      ctx.fillStyle=COL.inter;
      ctx.beginPath();ctx.arc(sx,sy,hw,0,Math.PI*2);ctx.fill();
      // Traffic signal dot
      if(scale>.6&&(cls===HIGHWAY||cls===ARTERIAL)){
        const k=oKey(x,y);
        const phase=signalPhase.get(k)||0;
        const timer=signalTimer.get(k)||0;
        const isGreen=timer>SIGNAL_CYCLE*.25;
        ctx.fillStyle=isGreen?(phase===0?COL.signal_green:COL.signal_red):COL.signal_amber;
        ctx.beginPath();ctx.arc(sx,sy,2.5*scale,0,Math.PI*2);ctx.fill();
      }
    }
  }
}

function drawBuildings(range){
  const{x0,y0,x1,y1}=range;
  const s=view.zoom;
  const px0=x0*CELL,py0=y0*CELL;

  ctx.save();
  ctx.translate(view.panX,view.panY);ctx.scale(s,s);

  for(const b of buildingCache){
    const bx=b.px/CELL|0,by=b.py/CELL|0;
    if(bx<x0||bx>=x1||by<y0||by>=y1)continue;

    if(b.type==='park'){
      ctx.fillStyle=COL.park;
      ctx.fillRect(b.px,b.py,CELL,CELL);
      if(s>.5){
        ctx.fillStyle=COL.parkTree;
        for(const t of b.trees){ctx.beginPath();ctx.arc(b.px+t.tx,b.py+t.ty,t.r,0,Math.PI*2);ctx.fill();}
      }
      continue;
    }
    if(b.type==='house'){
      const pad=3;
      ctx.fillStyle=b.dark?COL.lotBg:COL.lotBgAlt;
      ctx.beginPath();ctx.roundRect(b.px+pad,b.py+pad,CELL-pad*2,CELL-pad*2,2);ctx.fill();
      if(s>.35){
        ctx.fillStyle=b.roofCol;
        ctx.beginPath();ctx.roundRect(b.px+b.bx,b.py+b.by,b.bw,b.bh,b.rx);ctx.fill();
      }
      continue;
    }
    if(b.type==='tower'){
      const pad=2;
      ctx.fillStyle=COL.lotBg;
      ctx.beginPath();ctx.roundRect(b.px+pad,b.py+pad,b.cw-pad*2,b.ch-pad*2,3);ctx.fill();
      if(s>.25){
        for(const bl of b.blocks){
          ctx.fillStyle=bl.glass?COL.towerGlass:COL.roofB;
          ctx.beginPath();ctx.roundRect(b.px+bl.bx,b.py+bl.by,bl.bw,bl.bh,1);ctx.fill();
        }
      }
      continue;
    }
    if(b.type==='warehouse'){
      ctx.fillStyle='#141820';
      ctx.fillRect(b.px+2,b.py+2,b.cw-4,b.ch-4);
      if(s>.3){
        ctx.strokeStyle='#1e2535';ctx.lineWidth=1;
        ctx.strokeRect(b.px+3,b.py+3,b.cw-6,b.ch-6);
      }
    }
  }
  ctx.restore();
}

function drawGround(range){
  const{x0,y0,x1,y1}=range;
  const s=view.zoom;
  ctx.save();ctx.translate(view.panX,view.panY);ctx.scale(s,s);
  for(let y=y0;y<y1;y++){
    for(let x=x0;x<x1;x++){
      if(!cityMask[y]||!cityMask[y][x]){
        ctx.fillStyle=COL.fringe;ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
        continue;
      }
      if(grid[y][x]!==EMPTY)continue;
      const z=zone[y][x];
      ctx.fillStyle=z===Z.CBD?COL.zoneComm:z===Z.COM?COL.zoneComm:z===Z.IND?COL.zoneInd:z===Z.PARK?COL.park:COL.cityGround;
      ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
    }
  }
  ctx.restore();
}

function drawCar(c){
  ctx.save();
  const sx=c.rx*view.zoom+view.panX,sy=c.ry*view.zoom+view.panY;
  const sc=view.zoom;
  ctx.translate(sx,sy);ctx.rotate(c.angle);
  const l=c.len*sc,w=c.wid*sc;
  // Shadow
  ctx.fillStyle=COL.carShadow;
  ctx.beginPath();ctx.ellipse(sc*.8,sc*.8,l*.55,w*.55,0,0,Math.PI*2);ctx.fill();
  // Body
  ctx.fillStyle=c.stopped?COL.carStop:c.col;
  ctx.beginPath();ctx.roundRect(-l/2,-w/2,l,w,sc*1.5);ctx.fill();
  if(sc>.5){
    // Roof
    ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(-l/2+sc*1.5,-w/2+sc*.5,l-sc*3,w-sc);
    // Windscreen
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(l/2-sc*4,-w/2+sc*.5,sc*3,w-sc);
    // Headlights
    if(!c.stopped){
      ctx.fillStyle=COL.headlight;
      ctx.beginPath();ctx.ellipse(l/2+sc*3,0,sc*4.5,sc*1.5,0,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.restore();
}

function drawMinimap(){
  const mw=mmCanvas.width,mh=mmCanvas.height;
  mmCtx.fillStyle='#0a0c12';mmCtx.fillRect(0,0,mw,mh);
  const sx=mw/(GW*CELL),sy=mh/(GH*CELL);
  // Road pixels
  for(let y=0;y<GH;y++){
    for(let x=0;x<GW;x++){
      if(!grid[y][x])continue;
      const t=roadClassAt(x,y)||LOCAL;
      mmCtx.fillStyle=t===HIGHWAY?'#1a4060':t===ARTERIAL?'#1e3555':'#181e2e';
      mmCtx.fillRect(x*CELL*sx,y*CELL*sy,Math.ceil(CELL*sx)+1,Math.ceil(CELL*sy)+1);
    }
  }
  // Cars
  for(const c of cars){
    mmCtx.fillStyle=c.stopped?'#e05555':'#f0b429';
    mmCtx.fillRect(c.rx*sx-1,c.ry*sy-1,2,2);
  }
  // Viewport rect
  const vx=-view.panX/view.zoom,vy=-view.panY/view.zoom;
  const vw=canvas.width/view.zoom,vh=canvas.height/view.zoom;
  mmCtx.strokeStyle='rgba(240,180,41,.5)';mmCtx.lineWidth=1;
  mmCtx.strokeRect(vx*sx,vy*sy,vw*sx,vh*sy);
}

function drawScene(){
  ctx.fillStyle=COL.bg;ctx.fillRect(0,0,canvas.width,canvas.height);
  if(!grid||!grid.length)return;
  const range=visibleTileRange();
  drawGround(range);
  drawBuildings(range);
  drawRoads(range);
  for(const c of cars)drawCar(c);
  drawMinimap();
}

// ─── HUD UPDATES ─────────────────────────────────────────────────────────────
function fmtTime(t){
  const h=(t*24|0)%24,m=((t*24*60|0)%60);
  return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function todPhase(h){
  if(h<5)return'NIGHT';if(h<9)return'RUSH';if(h<12)return'MORN';
  if(h<14)return'NOON';if(h<17)return'AFTN';if(h<20)return'RUSH';
  if(h<22)return'EVE';return'NIGHT';
}

function updateHud(){
  const all=[...cars,...completed.slice(-300)];
  const avg=all.length?(all.reduce((s,c)=>s+c.travel,0)/all.length).toFixed(1):'0.0';
  document.getElementById('s-tick').textContent=tickN;
  document.getElementById('s-cars').textContent=cars.length;
  document.getElementById('s-done').textContent=completed.length;
  document.getElementById('s-stop').textContent=stoppedN;
  document.getElementById('s-avg').textContent=avg;
  document.getElementById('s-zoom').textContent=Math.round(view.zoom*100)+'%';
  const h=currentHour();
  document.getElementById('tod-label').textContent=fmtTime(simTime);
  document.getElementById('tod-fill').style.width=(simTime*100).toFixed(1)+'%';
  document.getElementById('tod-phase').textContent=todPhase(h);
}

// ─── INTERACTION ──────────────────────────────────────────────────────────────
function resizeCanvas(){
  const wrap=document.getElementById('world-wrap');
  canvas.width=wrap.clientWidth;canvas.height=wrap.clientHeight;
}
function resetView(){
  const s=Math.min(canvas.width/WW,canvas.height/WH)*.92;
  view.zoom=clamp(s,view.minZ,view.maxZ);
  view.panX=(canvas.width-WW*view.zoom)/2;
  view.panY=(canvas.height-WH*view.zoom)/2;
}
function zoomAt(sx,sy,factor){
  const oz=view.zoom,nz=clamp(oz*factor,view.minZ,view.maxZ);
  if(nz===oz)return;
  const wx=(sx-view.panX)/oz,wy=(sy-view.panY)/oz;
  view.zoom=nz;view.panX=sx-wx*nz;view.panY=sy-wy*nz;
}

const wrap=document.getElementById('world-wrap');
wrap.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,e.deltaY<0?1.12:.893);},{passive:false});
wrap.addEventListener('mousedown',e=>{if(e.button!==0)return;view.drag=true;view.dragX=e.clientX-view.panX;view.dragY=e.clientY-view.panY;wrap.classList.add('grab');});
window.addEventListener('mousemove',e=>{if(!view.drag)return;view.panX=e.clientX-view.dragX;view.panY=e.clientY-view.dragY;});
window.addEventListener('mouseup',()=>{view.drag=false;wrap.classList.remove('grab');});
window.addEventListener('resize',()=>{resizeCanvas();resetView();});

// Touch zoom
let lastPinch=0;
wrap.addEventListener('touchstart',e=>{if(e.touches.length===2)lastPinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:true});
wrap.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    const cx=(e.touches[0].clientX+e.touches[1].clientX)/2-wrap.getBoundingClientRect().left;
    const cy=(e.touches[0].clientY+e.touches[1].clientY)/2-wrap.getBoundingClientRect().top;
    if(lastPinch)zoomAt(cx,cy,d/lastPinch);
    lastPinch=d;
  }},{passive:true});

// Buttons
let paused=false,spd=1,tickAccum=0,lastT=0;
function setSpd(s,id){spd=s;['btn-slow','btn-norm','btn-fast'].forEach(i=>document.getElementById(i).classList.remove('on'));document.getElementById(id).classList.add('on');}
document.getElementById('btn-slow').onclick=()=>setSpd(.5,'btn-slow');
document.getElementById('btn-norm').onclick=()=>setSpd(1,'btn-norm');
document.getElementById('btn-fast').onclick=()=>setSpd(4,'btn-fast');
document.getElementById('btn-pause').onclick=function(){paused=!paused;this.textContent=paused?'Resume':'Pause';this.classList.toggle('on',paused);};
document.getElementById('btn-zin').onclick=()=>zoomAt(canvas.width/2,canvas.height/2,1.15);
document.getElementById('btn-zout').onclick=()=>zoomAt(canvas.width/2,canvas.height/2,.87);
document.getElementById('btn-zreset').onclick=()=>resetView();
document.getElementById('btn-regen').onclick=()=>startCity();

// ─── MAIN LOOP ────────────────────────────────────────────────────────────────
function loop(ts){
  const dt=Math.min((ts-lastT)/1000,.1);lastT=ts;
  if(!paused){
    tickAccum+=dt*1000;
    const iv=110/spd;
    while(tickAccum>=iv){simStep();tickAccum-=iv;}
  }
  for(const c of cars)c.update(dt);
  drawScene();updateHud();
  requestAnimationFrame(loop);
}

function setGenProgress(pct,phase,meta=''){
  document.getElementById('gen-phase').textContent=phase;
  document.getElementById('gen-bar-fill').style.width=clamp(pct,0,100)+'%';
  document.getElementById('gen-meta').textContent=meta;
}

let loopStarted=false;
async function startCity(){
  document.getElementById('gen-overlay').style.display='flex';
  simReset();buildingCache=[];
  resizeCanvas();
  await buildCity((pct,phase,meta)=>{setGenProgress(pct,phase,meta||'');});
  buildDrvCache();
  // Warm-up spawn
  for(let i=0;i<30;i++)spawnCar();
  resetView();
  document.getElementById('gen-overlay').style.display='none';
  setTimeout(()=>{document.getElementById('zoom-tip').style.opacity='0';},4000);
  if(!loopStarted){loopStarted=true;requestAnimationFrame(ts=>{lastT=ts;requestAnimationFrame(loop);});}
}

startCity();
</script>
</body>
